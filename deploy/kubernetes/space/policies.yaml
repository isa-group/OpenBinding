apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: space-api-traffic
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: space-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [gateway, worker]}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [space-mongodb, space-redis]}
      ports:
        - {protocol: TCP, port: 27017}
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: space-data-ingress
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [space-mongodb, space-redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: space-api}
      ports:
        - {protocol: TCP, port: 27017}
        - {protocol: TCP, port: 6379}
