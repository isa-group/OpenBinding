apiVersion: v1
kind: Service
metadata:
  name: engine-minizinc
  labels:
    app.kubernetes.io/name: engine-minizinc
spec:
  selector:
    app.kubernetes.io/name: engine-minizinc
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-minizinc
  labels:
    app.kubernetes.io/name: engine-minizinc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engine-minizinc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine-minizinc
    spec:
      serviceAccountName: openbinding
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: openbinding/engine-minizinc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: minizinc-tmp
              mountPath: /app/tmp_minizinc
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: minizinc-tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engine-random-search
  labels:
    app.kubernetes.io/name: engine-random-search
spec:
  selector:
    app.kubernetes.io/name: engine-random-search
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-random-search
  labels:
    app.kubernetes.io/name: engine-random-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engine-random-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine-random-search
    spec:
      serviceAccountName: openbinding
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: &enginePodSecurity
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: openbinding/engine-random-search:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /tmp
          startupProbe: &engineStartup
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe: &engineReadiness
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe: &engineLiveness
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources: &engineResources
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext: &engineContainerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
