# Copy to a private file, replace every value, then apply it before the base.
# This example is deliberately excluded from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: openbinding-secrets
  namespace: openbinding
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  DATABASE_URL: postgresql+asyncpg://openbinding:replace-with-url-encoded-password@postgres:5432/openbinding
  REDIS_PASSWORD: replace-with-a-long-random-password
  REDIS_URL: redis://:replace-with-url-encoded-password@redis:6379/0
  GATEWAY_JWT_SECRET: replace-with-at-least-32-random-bytes
  BOOTSTRAP_ADMIN_USERNAME: replace-with-admin-username
  BOOTSTRAP_ADMIN_EMAIL: replace-with-admin-email
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-a-long-random-password
  FEDERATION_SECRET_KEY: replace-with-a-fernet-key
  # Optional integrations. Keep each API key narrowly scoped as documented.
  SPHERE_API_KEY: replace-when-sphere-is-enabled
  SPHERE_ORGANIZATION_ID: replace-with-openbinding-organization-id
  SPACE_API_KEY: replace-when-space-is-enabled
  SPACE_DESTRUCTIVE_API_KEY: separate-all-permission-key
  SPACE_ADMIN_PASSWORD: replace-with-a-long-random-password
  SPACE_DATABASE_PASSWORD: replace-with-a-long-random-password
  SPACE_REDIS_PASSWORD: replace-with-a-long-random-password
  SPACE_JWT_SECRET: replace-with-at-least-32-random-bytes
  SPACE_JWT_SALT: replace-with-a-random-salt
