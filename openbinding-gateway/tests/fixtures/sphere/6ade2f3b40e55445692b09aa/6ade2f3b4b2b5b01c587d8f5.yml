plans:
  FREE:
    description: Test your integration with 100 emails/month. No overages allowed.
    price: 0
    unit: account/month
    features: null
    usageLimits: null
  BASIC:
    description: For solo developers and smaller teams.
    price: '#basicPriceByVolume[String(#volume)]'
    unit: account/month
    features:
      bulkEmailApi:
        value: true
      inboundEmail:
        value: false
    usageLimits:
      monthlyEmailVolumeLimit:
        value: 10000
      messageStreamsLimit:
        value: 15
      serversLimit:
        value: 5
      customSendingDomainsLimit:
        value: 5
      usersLimit:
        value: 4
  PRO:
    description: For start-ups and small businesses.
    price: '#proPriceByVolume[String(#volume)]'
    unit: account/month
    features:
      bulkEmailApi:
        value: true
    usageLimits:
      monthlyEmailVolumeLimit:
        value: 10000
  PLATFORM:
    description: For agencies and larger teams.
    price: '#platformPriceByVolume[String(#volume)]'
    unit: account/month
    features:
      bulkEmailApi:
        value: true
    usageLimits:
      monthlyEmailVolumeLimit:
        value: 10000
      messageStreamsLimit:
        value: .inf
      serversLimit:
        value: .inf
      customSendingDomainsLimit:
        value: .inf
      usersLimit:
        value: .inf
addOns:
  extraEmailsBasic:
    description: Extra emails beyond the Basic plan's monthly volume, billed per 1,000.
    price: '#basicOverageByVolume[String(#volume)]'
