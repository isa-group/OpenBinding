custom:
  unmodeled:
    - element: monthly volume tiers above 1,500,000 emails
      source_says: 'Volume table ends at 1,500,000 with ''More: Contact sales'' for every plan; the slider reaches 3,000,000 and pricing.txt says published pricing covers up to 3 million emails/month'
      why: a price map entry cannot be a negotiated price; the Contact-sales tier is not representable as a volume key
    - element: per-tier included volume
      source_says: each paid plan's included monthly volume equals the selected tier (10k, 50k, 125k, 300k, 700k, 1.5M)
      why: usage-limit values cannot use variables; monthlyEmailVolumeLimit is fixed at the 10,000 default tier
    - element: no overages on Free
      source_says: The Free plan does not allow overages
      why: expressed only by the absence of an overage add-on for FREE
    - element: overage billing timing
      source_says: Extra emails are calculated at the end of the billing cycle and included with the plan cost for the upcoming month
      why: Pricing2Yaml has no billing-timing construct
    - element: dedicated IP eligibility
      source_says: Requires at least 300,000 messages/month; an additional IP requires 100,000+ messages/day; no setup fees
      why: Pricing2Yaml has no usage-volume eligibility conditions for add-ons
    - element: custom activity retention price grid
      source_says: price depends on the base plan and the chosen period (7 to 365 days; 90, 180 and 365 days named in the launch post); grid published only as an image
      why: grid values unknown (image) and a retention period cannot drive a usage-limit value
    - element: DMARC monitoring tiers
      source_says: Starts at $14/month per domain (DMARC Digests is a separate product with its own pricing)
      why: only the starting price is published on the Postmark pricing page
    - element: bootstrapped company credit
      source_says: Launched, charging, no outside investment -> $75 account credit on request
      why: Pricing2Yaml has no customer-segment discounts or credits
    - element: high-volume custom pricing
      source_says: Big senders can contact sales for custom pricing
      why: negotiated pricing tied to volume, not a distinct published plan
