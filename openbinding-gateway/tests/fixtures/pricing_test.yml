# TEST FIXTURE, NOT A REAL PRICING.
# A minimal synthetic Pricing2Yaml used only by the test suite to build the fake
# pricing gate (tests/_pricing.py). The real pricings, versions, plans and
# contracts live in SPHERE and SPACE and are administered in their own consoles.
# It declares functional limits only: no capacity units and no consumption
# counters. Plan names, prices and numbers are invented for the tests.
syntaxVersion: '3.1'
saasName: openbinding
version: 0.1.0
createdAt: '2026-10-12T00:00:00Z'
currency: EUR
billing:
  monthly: 1
tags: [Test]

features:
  authoring:
    description: Author and validate packages.
    tag: Test
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['authoring']
  solve:
    description: Execute engines.
    tag: Test
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['solve'] && subscriptionContext['concurrentJobs'] < pricingContext['usageLimits']['concurrentJobs']
  federatedEngines:
    description: Register and execute federated engine revisions.
    tag: Test
    type: INTEGRATION
    integrationType: API
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['federatedEngines'] && subscriptionContext['concurrentJobs'] < pricingContext['usageLimits']['concurrentJobs']
  apiAccess:
    description: Use API keys.
    tag: Test
    type: INTEGRATION
    integrationType: API
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['apiAccess']
  collaboration:
    description: Organizations, projects, collections and reports.
    tag: Test
    type: MANAGEMENT
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['collaboration']
  studies:
    description: Comparative studies.
    tag: Test
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['studies']
  advancedAnalytics:
    description: Advanced analytics.
    tag: Test
    type: INFORMATION
    valueType: BOOLEAN
    defaultValue: false
    expression: pricingContext['features']['advancedAnalytics']
  reproducibleExport:
    description: Export packages with checksums and provenance.
    tag: Test
    type: INFORMATION
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['reproducibleExport']
  publishing:
    description: Freeze reports and publish results.
    tag: Test
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
    expression: pricingContext['features']['publishing']
  reproducibilityArchive:
    description: Extended archive and audit retention.
    tag: Test
    type: INFORMATION
    valueType: BOOLEAN
    defaultValue: false
    expression: pricingContext['features']['reproducibilityArchive']
  institutionalBranding:
    description: Institutional identity in authenticated surfaces.
    tag: Test
    type: INFORMATION
    valueType: BOOLEAN
    defaultValue: false
    expression: pricingContext['features']['institutionalBranding']

usageLimits:
  concurrentJobs:
    description: Jobs running at the same time for one actor.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: job
    linkedFeatures: [solve, federatedEngines, studies]
  federatedEngines:
    description: Federated engine revisions available to one actor.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: engine
    linkedFeatures: [federatedEngines]
  apiKeys:
    description: Active API keys owned by one actor.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: key
    linkedFeatures: [apiAccess]
  maxTimeoutSeconds:
    description: Maximum wall-clock budget for one job.
    tag: Test
    type: NON_RENEWABLE
    trackable: false
    valueType: NUMERIC
    defaultValue: 60
    unit: second
    linkedFeatures: [solve, federatedEngines]
  maxIterations:
    description: Maximum search iterations for one job.
    tag: Test
    type: NON_RENEWABLE
    trackable: false
    valueType: NUMERIC
    defaultValue: 10000
    unit: iteration
    linkedFeatures: [solve]
  maxPayloadBytes:
    description: Maximum package size for one request.
    tag: Test
    type: NON_RENEWABLE
    trackable: false
    valueType: NUMERIC
    defaultValue: 8388608
    unit: byte
    linkedFeatures: [authoring, solve]
  maxInstanceComplexityLog10:
    description: Maximum base-10 logarithm of the binding search space.
    tag: Test
    type: NON_RENEWABLE
    trackable: false
    valueType: NUMERIC
    defaultValue: 9
    unit: log10 combinations
    linkedFeatures: [solve]
  jobHistoryDays:
    description: Retention of finished jobs and results.
    tag: Test
    type: NON_RENEWABLE
    trackable: false
    valueType: NUMERIC
    defaultValue: 7
    unit: day
    linkedFeatures: [reproducibleExport]
  organizations:
    description: Organizations sponsored across assigned subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: organization
    linkedFeatures: [collaboration]
  members:
    description: Unique members across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 2
    unit: member
    linkedFeatures: [collaboration]
  projects:
    description: Projects across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 3
    unit: project
    linkedFeatures: [collaboration]
  privateProjects:
    description: Private projects across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: project
    linkedFeatures: [collaboration]
  collections:
    description: Collections across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 2
    unit: collection
    linkedFeatures: [collaboration]
  studies:
    description: Study definitions across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 1
    unit: study
    linkedFeatures: [studies]
  storageBytes:
    description: Artifact storage across sponsored subtrees.
    tag: Test
    type: NON_RENEWABLE
    trackable: true
    valueType: NUMERIC
    defaultValue: 104857600
    unit: byte
    linkedFeatures: [reproducibleExport]

plans:
  BASIC:
    description: Test default plan (the only non-RESEARCH plan with price 0).
    price: 0.0
    unit: user/month
    features: &basicFeatures
      authoring: { value: true }
      solve: { value: true }
      federatedEngines: { value: true }
      apiAccess: { value: true }
      collaboration: { value: true }
      studies: { value: true }
      reproducibleExport: { value: true }
      publishing: { value: true }
    usageLimits:
      concurrentJobs: { value: 1 }
      federatedEngines: { value: 1 }
      apiKeys: { value: 1 }
      maxTimeoutSeconds: { value: 60 }
      maxIterations: { value: 10000 }
      maxPayloadBytes: { value: 8388608 }
      maxInstanceComplexityLog10: { value: 9 }
      jobHistoryDays: { value: 7 }
      organizations: { value: 1 }
      members: { value: 2 }
      projects: { value: 3 }
      privateProjects: { value: 1 }
      collections: { value: 2 }
      studies: { value: 1 }
      storageBytes: { value: 104857600 }
  ADVANCED:
    description: Test mid-size plan.
    price: Contact us
    unit: user/month
    features:
      <<: *basicFeatures
      advancedAnalytics: { value: true }
    usageLimits:
      concurrentJobs: { value: 2 }
      federatedEngines: { value: 3 }
      apiKeys: { value: 10 }
      maxTimeoutSeconds: { value: 600 }
      maxIterations: { value: 500000 }
      maxPayloadBytes: { value: 67108864 }
      maxInstanceComplexityLog10: { value: 15 }
      jobHistoryDays: { value: 90 }
      organizations: { value: 2 }
      members: { value: 10 }
      projects: { value: 25 }
      privateProjects: { value: 15 }
      collections: { value: 25 }
      studies: { value: 10 }
      storageBytes: { value: 1073741824 }
  RESEARCH:
    description: Test institutional plan, free, for verified CAS accounts.
    price: 0.0
    unit: user/month
    features:
      <<: *basicFeatures
      advancedAnalytics: { value: true }
      institutionalBranding: { value: true }
    usageLimits:
      concurrentJobs: { value: 3 }
      federatedEngines: { value: 5 }
      apiKeys: { value: 25 }
      maxTimeoutSeconds: { value: 900 }
      maxIterations: { value: 1000000 }
      maxPayloadBytes: { value: 134217728 }
      maxInstanceComplexityLog10: { value: 20 }
      jobHistoryDays: { value: 180 }
      organizations: { value: 5 }
      members: { value: 15 }
      projects: { value: 50 }
      privateProjects: { value: 30 }
      collections: { value: 50 }
      studies: { value: 25 }
      storageBytes: { value: 5368709120 }
  PRO:
    description: Test high-capacity plan.
    price: Contact us
    unit: user/month
    features:
      <<: *basicFeatures
      advancedAnalytics: { value: true }
      reproducibilityArchive: { value: true }
    usageLimits:
      concurrentJobs: { value: 8 }
      federatedEngines: { value: 20 }
      apiKeys: { value: .inf }
      maxTimeoutSeconds: { value: 1800 }
      maxIterations: { value: 10000000 }
      maxPayloadBytes: { value: 536870912 }
      maxInstanceComplexityLog10: { value: .inf }
      jobHistoryDays: { value: 365 }
      organizations: { value: 10 }
      members: { value: 100 }
      projects: { value: 500 }
      privateProjects: { value: 500 }
      collections: { value: 500 }
      studies: { value: 250 }
      storageBytes: { value: 21474836480 }

addOns:
  EXTRA_COLLABORATION:
    description: Test add-on, more members and projects.
    availableFor: [ADVANCED, PRO]
    price: Contact us
    unit: pack/month
    subscriptionConstraints: { minQuantity: 1, maxQuantity: 10, quantityStep: 1 }
    usageLimitsExtensions:
      members: { value: 5 }
      projects: { value: 10 }
  EXTRA_STORAGE:
    description: Test add-on, more artifact storage.
    availableFor: [ADVANCED, PRO]
    price: Contact us
    unit: pack/month
    subscriptionConstraints: { minQuantity: 1, maxQuantity: 20, quantityStep: 1 }
    usageLimitsExtensions:
      storageBytes: { value: 5368709120 }
  EXTRA_FEDERATION:
    description: Test add-on, more federated engines.
    availableFor: [PRO]
    price: Contact us
    unit: pack/month
    subscriptionConstraints: { minQuantity: 1, maxQuantity: 10, quantityStep: 1 }
    usageLimitsExtensions:
      federatedEngines: { value: 2 }
