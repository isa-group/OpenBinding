      cost: 950
      execution_time: 520
      availability: 0.9998999999999999
      reliability: 0.995
      security: 5
goals:
- property: cost
  normalize:
    min: 0
    max: 10000
- property: execution_time
  normalize:
    min: 0
    max: 20000
- property: availability
  normalize:
    min: 0
    max: 1
- property: reliability
  normalize:
    min: 0
    max: 1
- property: security
  normalize:
    min: 1
    max: 5

