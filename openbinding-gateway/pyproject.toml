[project]
name = "openbinding-gateway"
version = "0.1.0"
description = "QoS-aware service composition gateway"
requires-python = ">=3.11"
# Upper bounds on the majors: FastAPI and Pydantic have broken things across
# them before, and an unbounded floor means a fresh install can fail for
# reasons unrelated to any change here.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
    "pyyaml>=6.0,<7.0",
    # Offline validation against the vendored OMG BPMN 2.0.2 XSD bundle.
    "lxml>=5.2,<7.0",
    "python-dotenv>=1.0,<2.0",
    # Accounts, sessions and API keys. SQLAlchemy talks to Postgres through
    # asyncpg in a deployment and to SQLite through aiosqlite in the tests,
    # which is why both drivers are here rather than only the one prod uses.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "pyjwt>=2.8,<3.0",
    "argon2-cffi>=23.1,<26.0",
    # Pydantic's EmailStr needs this; an account's email is one of the two
    # ways to sign in, so validating it is not cosmetic.
    "email-validator>=2.0,<3.0",
    # Fernet, for the credentials users register alongside their own solvers.
    "cryptography>=42.0",
    # Durable jobs are persisted in PostgreSQL and delivered through Redis.
    "dramatiq[redis]>=1.17,<2.0",
    "redis>=5.0,<7.0",
    # SPACE 1.5 is exposed through the native async v1 client.
    "space-python-client>=1.0,<2.0",
    # The BIM language (compile, evaluate, re-evaluate) is a release of
    # javiercavlop/bim-toolchain, reached through bim_client.BimPort and run in
    # process. Exact versions: the wheels are pinned by file (below) and SHA-256
    # (uv.lock); a new release is a PR here that passes the consumer contract
    # (CI job bim-toolchain). bim-service is only a test dependency.
    "bim-core==0.2.0",
    "bim-client==0.2.0",
]

[project.optional-dependencies]
test = [
    "pandas>=2.2,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "requests>=2.31,<3.0",
    "ruff>=0.4,<1.0",
    "scipy>=1.11,<2.0",
    # The HTTP port (bim_client.HttpBim) is tested against the real service, in process.
    "bim-service==0.2.0",
]

# The wheels of release v0.2.0 of javiercavlop/bim-toolchain (GitHub Release
# assets) as files of .bim-wheels/, whose SHA-256 uv.lock records. While that
# repository is private GitHub serves its assets only through the API with a
# token, so they cannot be plain URLs here (they can once it is public):
# `python3 tools/fetch_bim_toolchain.py --wheels` (repository root) downloads
# them and keeps a file only if its SHA-256 is the lock's (token:
# BIM_TOOLCHAIN_TOKEN, or `gh auth token`). A new release: fetch it with
# `--wheels --bootstrap vX.Y.Z`, change the three paths and the two versions,
# `uv lock`. Keep experimentation/qacobench/bim-toolchain.txt on the same release.
[tool.uv.sources]
bim-core = { path = ".bim-wheels/bim_core-0.2.0-py3-none-any.whl" }
bim-client = { path = ".bim-wheels/bim_client-0.2.0-py3-none-any.whl" }
bim-service = { path = ".bim-wheels/bim_service-0.2.0-py3-none-any.whl" }

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Errors, unused imports and names, and the bug patterns worth catching.
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a call in a default argument runs once at import. That is
# precisely how FastAPI's dependency markers are meant to be written, so these
# are declarations rather than the mistake the rule is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The accounts tests are async because the database layer is; the older suite
# is synchronous and unaffected by this.
asyncio_mode = "auto"
# Integration tests need the whole compose stack on localhost:8000, so a bare
# `pytest` runs only the unit suite. Use `-m integration` to opt in.
addopts = "-m 'not integration'"
markers = [
    "integration: needs the docker-compose stack with every engine running",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
    "import-linter==2.15",
]
