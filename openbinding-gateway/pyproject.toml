[project]
name = "openbinding-gateway"
version = "0.1.0"
description = "QoS-aware service composition gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "httpx",
    "jsonschema",
    "pyyaml",
    "python-dotenv"
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "requests",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests need the whole compose stack on localhost:8000, so a bare
# `pytest` runs only the unit suite. Use `-m integration` to opt in.
addopts = "-m 'not integration'"
markers = [
    "integration: needs the docker-compose stack with every engine running",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
