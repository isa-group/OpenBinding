x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY_ARG:-}
  HTTPS_PROXY: ${HTTPS_PROXY_ARG:-}
  NO_PROXY: ${NO_PROXY_ARG:-localhost,127.0.0.1,postgres,redis,gateway-dev,worker-dev,engine-minizinc,engine-random-search,engine-many-heuristic,engine-multi-heuristic,engine-evolutionary-heuristics,frontend-dev,nginx-dev}

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["dev", "db-tools"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openbinding}
      - POSTGRES_USER=${POSTGRES_USER:-openbinding}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openbinding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The user has to be named, or pg_isready checks for a role called root.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbinding} -d ${POSTGRES_DB:-openbinding}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    profiles: ["dev"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-dev:
    build:
      context: .
      dockerfile: openbinding-gateway/Dockerfile
      args:
        <<: *proxy-build-args
      secrets: [bim_toolchain_token]
    profiles: ["dev"]
    ports:
      # Loopback only: this profile runs with development defaults and must
      # not be reachable from other machines.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./schemas:/app/schemas
      - ./openbinding-gateway:/app
      - ./examples:/app/examples:ro
      - ./docs:/app/docs:ro
      - ./engines:/app/engines:ro
      - ./tools:/app/repository-tools:ro
      # The reduced ICSOC integration regression regenerates one historical
      # case in pytest's temporary directory; the 479 MB generated corpus is
      # deliberately not mounted or committed.
      - ./experimentation:/app/experimentation:ro
      - ./pricings:/app/pricings:ro
      # The whole checkout, read-only. The service's own tree is only /app plus
      # the mounts above; tests that read frontend/, the compose files or
      # .env.example run with OPENBINDING_REPO_ROOT=/workspace.
      - .:/workspace:ro
      - artifacts:/var/lib/openbinding/artifacts
    environment:
      - APP_ENV=dev
      - OPENBINDING_REPO_ROOT=/app
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS_DEV:-http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-openbinding}:${POSTGRES_PASSWORD:-openbinding}@postgres:5432/${POSTGRES_DB:-openbinding}
      # No default: a well-known signing key is worse than none. ./up.sh writes
      # a random one into .env when it is missing; otherwise set it (>= 32 chars).
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET (at least 32 random characters), or start the stack with ./up.sh which generates one}
      # X-Forwarded-For is believed only from these networks (a reverse proxy in front of the gateway).
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Opt-in: seed an `admin` account (password: BOOTSTRAP_ADMIN_PASSWORD) when
      # the database has no accounts. Off unless set; there is no default password.
      - SEED_DEFAULT_ADMIN=${SEED_DEFAULT_ADMIN:-false}
      # false (the default here) builds the stateless open gate: development only.
      - SPACE_ENABLED=${SPACE_ENABLED:-false}
      - SPACE_URL=${SPACE_URL:-https://space.score.us.es}
      - SPACE_API_KEY=${SPACE_API_KEY:-}
      - SPACE_TIMEOUT_MS=${SPACE_TIMEOUT_MS:-5000}
      - SPACE_PRICING_VERSION=${SPACE_PRICING_VERSION:-0.1.0}
      - SPACE_DEFAULT_PLAN=${SPACE_DEFAULT_PLAN:-}
      - REDIS_URL=redis://redis:6379/0
      - JOB_DISPATCH_MODE=dramatiq
      - ARTIFACT_ROOT=/var/lib/openbinding/artifacts
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - SPHERE_ENABLED=${SPHERE_ENABLED:-false}
      - SPHERE_URL=${SPHERE_URL:-https://sphere.score.us.es}
      - SPHERE_API_KEY=${SPHERE_API_KEY:-}
      - SPHERE_ORGANIZATION_ID=${SPHERE_ORGANIZATION_ID:-}
      - CAS_ENABLED=${CAS_ENABLED:-false}
      - CAS_ENVIRONMENT=${CAS_ENVIRONMENT:-preproduction}
      - CAS_STORE_BACKEND=redis
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # BIM (compile, evaluate, re-evaluate) runs in this process (bim_client's
      # InProcessBim). The BIM toolchain lives in its own repository
      # (javiercavlop/bim-toolchain); this stack builds and runs no bim-service.
      - BIM_MODE=${BIM_MODE:-inproc}
      # Comma-separated Fernet keys for stored engine credentials: the first
      # encrypts, all decrypt (rotation). FEDERATION_SECRET_KEY is the legacy
      # single key, still read after them.
      - SECRETS_FERNET_KEYS=${SECRETS_FERNET_KEYS:-}
      - FEDERATION_SECRET_KEY=${FEDERATION_SECRET_KEY:-}
      - FEDERATION_REQUIRE_HTTPS=${FEDERATION_REQUIRE_HTTPS:-false}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
      - ENGINE_EVOLUTIONARY_HEURISTICS_URL=http://engine-evolutionary-heuristics:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-many-heuristic:
        condition: service_healthy
      engine-evolutionary-heuristics:
        condition: service_healthy

  worker-dev:
    build:
      context: .
      dockerfile: openbinding-gateway/Dockerfile
      args:
        <<: *proxy-build-args
      secrets: [bim_toolchain_token]
    profiles: ["dev"]
    entrypoint: []
    command: ["dramatiq", "openbinding_gateway.worker", "--processes", "1", "--threads", "4", "--queues", "default"]
    volumes:
      - ./schemas:/app/schemas:ro
      - ./openbinding-gateway:/app
      - ./pricings:/app/pricings:ro
      - artifacts:/var/lib/openbinding/artifacts
    environment:
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-openbinding}:${POSTGRES_PASSWORD:-openbinding}@postgres:5432/${POSTGRES_DB:-openbinding}
      - REDIS_URL=redis://redis:6379/0
      - JOB_DISPATCH_MODE=dramatiq
      - SPACE_ENABLED=${SPACE_ENABLED:-false}
      - SPACE_URL=${SPACE_URL:-https://space.score.us.es}
      - SPACE_API_KEY=${SPACE_API_KEY:-}
      - SPACE_TIMEOUT_MS=${SPACE_TIMEOUT_MS:-5000}
      - SPACE_PRICING_VERSION=${SPACE_PRICING_VERSION:-0.1.0}
      - SPACE_DEFAULT_PLAN=${SPACE_DEFAULT_PLAN:-}
      # Comma-separated Fernet keys for stored engine credentials: the first
      # encrypts, all decrypt (rotation). FEDERATION_SECRET_KEY is the legacy
      # single key, still read after them.
      - SECRETS_FERNET_KEYS=${SECRETS_FERNET_KEYS:-}
      - FEDERATION_SECRET_KEY=${FEDERATION_SECRET_KEY:-}
      - FEDERATION_REQUIRE_HTTPS=${FEDERATION_REQUIRE_HTTPS:-false}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
      - ENGINE_EVOLUTIONARY_HEURISTICS_URL=http://engine-evolutionary-heuristics:8080
      # The worker re-evaluates every engine answer through BIM: same choice as the gateway.
      - BIM_MODE=${BIM_MODE:-inproc}
      - ARTIFACT_ROOT=/var/lib/openbinding/artifacts
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - SPHERE_ENABLED=${SPHERE_ENABLED:-false}
      - SPHERE_URL=${SPHERE_URL:-https://sphere.score.us.es}
      - SPHERE_API_KEY=${SPHERE_API_KEY:-}
      - SPHERE_ORGANIZATION_ID=${SPHERE_ORGANIZATION_ID:-}
    depends_on:
      gateway-dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  adminer:
    image: adminer:5
    profiles: ["db-tools"]
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  engine-minizinc:
    build:
      context: ./engines/minizinc-csp
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  engine-random-search:
    build:
      context: ./engines
      dockerfile: random-search/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  engine-many-heuristic:
    build:
      context: ./engines
      dockerfile: many-heuristic/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Runnable third-party deployment example. It is intentionally not a
  # gateway dependency and has no ENGINE_*_URL; federation happens via /v1.
  engine-multi-heuristic:
    build:
      context: ./engines
      dockerfile: multi-heuristic/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["federated-example"]
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  engine-evolutionary-heuristics:
    build:
      context: ./engines
      dockerfile: evolutionary-heuristics/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  qacobench-runner:
    build:
      context: .
      dockerfile: experimentation/qacobench/Dockerfile
      args:
        <<: *proxy-build-args
      secrets: [bim_toolchain_token]
    profiles: ["benchmark", "dev"]
    ports:
      - "${QACOBENCH_JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/workspace
      - ./schemas:/app/schemas:ro
      - ./openbinding-gateway/src:/app/src:ro
      - artifacts:/var/lib/openbinding/artifacts
    environment:
      - PYTHONPATH=/workspace/openbinding-gateway/src:/workspace
      - OPENBINDING_GATEWAY_URL=http://gateway-dev:8000
      - SCHEMAS_DIR=/workspace/schemas
    depends_on:
      gateway-dev:
        condition: service_healthy
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-evolutionary-heuristics:
        condition: service_healthy

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        <<: *proxy-build-args
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_DEV:-http://localhost:8000}
    profiles: ["dev"]
    ports:
      - "5173:5173"
    # The source, so editing a file changes what the dev server serves. Without
    # these it ran Vite over a copy baked into the image at build time, so the
    # "dev" profile needed a rebuild per edit while the gateway beside it
    # reloaded - which is not what anybody means by a dev profile. Only these
    # three, because mounting all of ./frontend would hide the image's
    # node_modules.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      # /examples requests hitting the vite dev server directly are proxied to
      # the nginx-dev static server (see frontend/vite.config.ts).
      - EXAMPLES_PROXY_TARGET=http://nginx-dev:80
      # A bind mount on macOS or Windows delivers no inotify events, so the
      # watcher sees nothing without polling.
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      gateway-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-dev:
    build:
      context: ./nginx/local
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    ports:
      - "80:80"
    volumes:
      - ./examples:/usr/share/nginx/html/examples:ro
    depends_on:
      gateway-dev:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# The token that reads the private bim-toolchain release whose wheels (bim-core, bim-client) the gateway image
# installs (openbinding-gateway/Dockerfile). Export BIM_TOOLCHAIN_TOKEN before building.
secrets:
  bim_toolchain_token:
    environment: BIM_TOOLCHAIN_TOKEN

volumes:
  artifacts:
  pgdata:
  redisdata:

networks:
  default:
