x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY_ARG:-}
  HTTPS_PROXY: ${HTTPS_PROXY_ARG:-}
  NO_PROXY: ${NO_PROXY_ARG:-localhost,127.0.0.1,gateway,gateway-dev,engine-minizinc,engine-random-search,engine-many-heuristic,engine-evolutionary-heuristics,frontend-dev,frontend-prod,nginx,nginx-dev}

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["dev", "prod"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openbinding}
      - POSTGRES_USER=${POSTGRES_USER:-openbinding}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openbinding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The user has to be named, or pg_isready checks for a role called root.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbinding} -d ${POSTGRES_DB:-openbinding}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["prod"]
    volumes:
      - ./schemas:/app/schemas
      # The pricing document is served by GET /v1/schemas/pricing and rendered
      # by the interface's plans page, and it lives outside the gateway's own
      # directory - so without this it is simply not in the image.
      - ./space/pricing:/app/space/pricing:ro
      - ./openbinding-gateway:/app
      - ./examples/generated_instances:/app/examples/generated_instances
    environment:
      - APP_ENV=prod
      - GENERAL_SCHEMA_PATH=/app/schemas/general/schema.json
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS_PROD:-https://openbinding.score.us.es,https://openbinding.us.es}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-openbinding}:${POSTGRES_PASSWORD:-openbinding}@postgres:5432/${POSTGRES_DB:-openbinding}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET before starting the prod profile}
      - AUTH_REQUIRED_FOR_SOLVE=${AUTH_REQUIRED_FOR_SOLVE:-true}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - SPACE_ENABLED=${SPACE_ENABLED:-false}
      - SPACE_URL=${SPACE_URL:-http://space-server:3000}
      - SPACE_API_KEY=${SPACE_API_KEY:-}
      - SPACE_TIMEOUT_MS=${SPACE_TIMEOUT_MS:-5000}
      - SPACE_FAIL_MODE=${SPACE_FAIL_MODE:-closed}
      - FEDERATION_SECRET_KEY=${FEDERATION_SECRET_KEY:-}
      - FEDERATION_REQUIRE_HTTPS=${FEDERATION_REQUIRE_HTTPS:-true}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
      - ENGINE_EVOLUTIONARY_HEURISTICS_URL=http://engine-evolutionary-heuristics:8080
    networks:
      - default
      - space
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-many-heuristic:
        condition: service_healthy
      engine-evolutionary-heuristics:
        condition: service_healthy

  gateway-dev:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    ports:
      - "8000:8000"
    volumes:
      - ./schemas:/app/schemas
      # The pricing document is served by GET /v1/schemas/pricing and rendered
      # by the interface's plans page, and it lives outside the gateway's own
      # directory - so without this it is simply not in the image.
      - ./space/pricing:/app/space/pricing:ro
      - ./openbinding-gateway:/app
      - ./examples/generated_instances:/app/examples/generated_instances
    environment:
      - APP_ENV=dev
      - GENERAL_SCHEMA_PATH=/app/schemas/general/schema.json
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS_DEV:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-openbinding}:${POSTGRES_PASSWORD:-openbinding}@postgres:5432/${POSTGRES_DB:-openbinding}
      # Development only. Production refuses to start without a real one.
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:-development-secret-do-not-use-in-production}
      - AUTH_REQUIRED_FOR_SOLVE=${AUTH_REQUIRED_FOR_SOLVE:-true}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - SPACE_ENABLED=${SPACE_ENABLED:-false}
      - SPACE_URL=${SPACE_URL:-http://space-server:3000}
      - SPACE_API_KEY=${SPACE_API_KEY:-}
      - SPACE_TIMEOUT_MS=${SPACE_TIMEOUT_MS:-5000}
      - SPACE_FAIL_MODE=${SPACE_FAIL_MODE:-open}
      - FEDERATION_SECRET_KEY=${FEDERATION_SECRET_KEY:-}
      - FEDERATION_REQUIRE_HTTPS=${FEDERATION_REQUIRE_HTTPS:-false}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
      - ENGINE_EVOLUTIONARY_HEURISTICS_URL=http://engine-evolutionary-heuristics:8080
    networks:
      - default
      - space
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-many-heuristic:
        condition: service_healthy
      engine-evolutionary-heuristics:
        condition: service_healthy

  engine-minizinc:
    build:
      context: ./engines/minizinc-csp
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  engine-random-search:
    build:
      context: ./engines
      dockerfile: random-search/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  engine-many-heuristic:
    build:
      context: ./engines
      dockerfile: many-heuristic/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  engine-evolutionary-heuristics:
    build:
      context: ./engines
      dockerfile: evolutionary-heuristics/Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        <<: *proxy-build-args
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_DEV:-http://localhost:8000}
    profiles: ["dev"]
    ports:
      - "5173:5173"
    environment:
      # /examples requests hitting the vite dev server directly are proxied to
      # the nginx-dev static server (see frontend/vite.config.ts).
      - EXAMPLES_PROXY_TARGET=http://nginx-dev:80
    depends_on:
      gateway-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod-assets
      args:
        <<: *proxy-build-args
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PROD:-/api}
    profiles: ["prod"]
    volumes:
      - frontend_dist:/out
    command: ["sh", "-c", "rm -rf /out/* && cp -a /dist/. /out/ && tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/out/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-dev:
    build:
      context: ./nginx/local
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    ports:
      - "80:80"
    volumes:
      - ./examples:/usr/share/nginx/html/examples:ro
    depends_on:
      gateway-dev:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx/production
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./examples:/opt/openbinding/examples:ro
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      gateway:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  frontend_dist:
  pgdata:

networks:
  default:
  # Where the SPACE instance lives. External because neither project owns it:
  # SPACE's own override joins the same network from the other side, and both
  # expect it to have been created once, by hand:
  #
  #     docker network create openbinding-space
  #
  # Nothing is published on the host - the gateway reaches SPACE at
  # http://space-server:3000, the API container itself rather than the nginx in
  # front of it, so a gateway that can start does not depend on a proxy it does
  # not own being healthy.
  space:
    name: openbinding-space
    external: true
