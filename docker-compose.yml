x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gateway,gateway-dev,engine-minizinc,engine-random-search,engine-many-heuristic,frontend-dev,frontend-prod,nginx,nginx-dev}

services:
  gateway:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["prod"]
    volumes:
      - ./schemas:/app/schemas
      - ./openbinding-gateway:/app
      - ./examples/generated_instances:/app/examples/generated_instances
    environment:
      - APP_ENV=prod
      - GENERAL_SCHEMA_PATH=/app/schemas/general/schema.json
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS_PROD:-https://openbinding.score.us.es,https://openbinding.us.es}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-many-heuristic:
        condition: service_healthy

  gateway-dev:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    ports:
      - "8000:8000"
    volumes:
      - ./schemas:/app/schemas
      - ./openbinding-gateway:/app
      - ./examples/generated_instances:/app/examples/generated_instances
    environment:
      - APP_ENV=dev
      - GENERAL_SCHEMA_PATH=/app/schemas/general/schema.json
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS_DEV:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173}
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
      - ENGINE_MANY_HEURISTIC_URL=http://engine-many-heuristic:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy
      engine-many-heuristic:
        condition: service_healthy

  engine-minizinc:
    build:
      context: ./engines/minizinc-csp
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  engine-random-search:
    build:
      context: ./engines/random-search
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  engine-many-heuristic:
    build:
      context: ./engines/many-heuristic
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev", "prod"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        <<: *proxy-build-args
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_DEV:-http://localhost:8000}
    profiles: ["dev"]
    ports:
      - "5173:5173"
    depends_on:
      gateway-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod-static
      args:
        <<: *proxy-build-args
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PROD:-/api}
    profiles: ["prod"]
    volumes:
      - ./examples:/usr/share/nginx/html/examples:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-dev:
    build:
      context: ./nginx/local
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["dev"]
    ports:
      - "80:80"
    volumes:
      - ./examples:/usr/share/nginx/html/examples:ro
    depends_on:
      gateway-dev:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx/production
      dockerfile: Dockerfile
      args:
        <<: *proxy-build-args
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      gateway:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
