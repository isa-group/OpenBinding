services:
  gateway:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./schemas:/app/schemas
      - ./openbinding-gateway:/app
      - ./examples/generated_instances:/app/examples/generated_instances
    environment:
      - GENERAL_SCHEMA_PATH=/app/schemas/general/schema.json
      - SCHEMAS_DIR=/app/schemas
      - PYTHONPATH=/app/src
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_RANDOM_SEARCH_URL=http://engine-random-search:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      engine-minizinc:
        condition: service_healthy
      engine-random-search:
        condition: service_healthy

  engine-minizinc:
    build:
      context: ./engines/minizinc-csp
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  engine-random-search:
    build:
      context: ./engines/random-search
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./examples:/usr/share/nginx/html/examples:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
