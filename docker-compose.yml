version: '3.8'

services:
  gateway:
    build:
      context: ./openbinding-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./schemas:/app/schemas
    environment:
      - UNIVERSAL_SCHEMA_PATH=/app/schemas/universal/schema.json
      - SCHEMAS_DIR=/app/schemas
      - ENGINE_MINIZINC_URL=http://engine-minizinc:3000
      - ENGINE_MANY_OBJ_URL=http://engine-many-obj:8080
    depends_on:
      - engine-minizinc
      - engine-many-obj

  engine-minizinc:
    build:
      context: ./engines/minizinc-csp
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  engine-many-obj:
    build:
      context: ./engines/many-obj
      dockerfile: Dockerfile
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - gateway
