<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Account" style="font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #1f1f1f; display: flex; flex-direction: column; gap: 2px;">
<span style="padding: 0 12px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #6a6a6a;">Account</span>
<sc-for list="{{items}}" as="i" hint-placeholder-count="5">
<a href="{{i.href}}" aria-current="{{i.current}}" style="{{i.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.label}}</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["profile","usage","keys","identities","notifications"],"default":"profile"},"$preview":{"width":280,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "profile";
    const defs = [
      ["profile", "Profile & security", "AcctProfile.dc.html", "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6"],
      ["usage", "Usage & plan", "AcctUsage.dc.html", "M4 20V10M10 20V4M16 20v-7M22 20H2"],
      ["keys", "API keys", "AcctKeys.dc.html", "M15 7a4 4 0 1 1-3.9 5H3v3h3v3h3v-3h2.1A4 4 0 0 1 15 7z"],
      ["identities", "Identities", "AcctIdentities.dc.html", "M4 5h16v14H4zM8 10h.01M12 10h4M8 14h8"],
      ["notifications", "Notifications", "AcctNotifications.dc.html", "M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"]
    ];
    const items = defs.map(([k, label, href, icon]) => ({
      label: label, href: href, icon: icon, current: a === k ? "page" : "false",
      style: "display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; " + (a === k ? "background: rgba(0,119,182,0.1); color: #0077b6;" : "color: #6a6a6a;")
    }));
    return { items: items };
  }
}
</script>
</body>
</html>
