<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenBinding · Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#0077b6}a:hover{color:#023e8a}
*:focus-visible{outline:2px solid #0077b6;outline-offset:2px}
@keyframes ob-spin{to{transform:rotate(360deg)}}
@keyframes ob-fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ob-spin{animation:ob-spin .9s linear infinite}
.ob-in{animation:ob-fadeup 400ms ease-out both}
@media (prefers-reduced-motion: reduce){.ob-spin,.ob-in{animation:none !important}}
@media (max-width: 1023px){.ob-hide-md{display:none !important}.ob-show-md{display:block !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #ffffff; color: #1f1f1f; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.5;">
<dc-import name="ShellSimBar" persona="{{persona}}" state="{{st}}" na="{{na}}" scenarios="{{scenarios}}" scenario="{{scenario}}" on-persona="{{setPersona}}" on-state="{{setSt}}" on-scenario="{{setScenario}}" screen="auth-reset-complete" route="/password-reset/complete?token=…" hint-size="100%,44px"></dc-import>
<div style="flex: 1; display: flex; min-height: 820px;">
<div class="ob-hide-md" aria-hidden="true" style="position: relative; width: 50%; overflow: hidden; background: linear-gradient(155deg, #00b4d8 0%, #0077b6 35%, #023e8a 65%, #1f1f1f 100%);">
<div style="position: absolute; left: -96px; top: -96px; width: 320px; height: 320px; border-radius: 9999px; background: rgba(72,202,228,0.15);"></div>
<div style="position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 40px;">
<svg width="260" height="150" viewBox="0 0 260 150" fill="none" stroke="#ffffff" stroke-width="1.5"><rect x="8" y="60" width="44" height="30" rx="8"></rect><path d="M52 75h24"></path><rect x="76" y="28" width="44" height="30" rx="8"></rect><rect x="76" y="92" width="44" height="30" rx="8"></rect><path d="M76 75v-32M76 75v32"></path><path d="M120 43h20v32M120 107h20V75M140 75h18"></path><rect x="158" y="60" width="44" height="30" rx="8" stroke-dasharray="4 3"></rect><path d="M202 75h18"></path><circle cx="236" cy="75" r="14"></circle><path d="M230 75l4 4 8-8"></path></svg>
<div style="text-align: center;"><div style="font-family: 'PP Editorial Old', 'Times New Roman', Georgia, serif; font-size: 44px; color: #ffffff;">OpenBinding</div><div style="margin-top: 6px; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.7);">Deterministic QoS binding</div></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #f1f8fc 0%, #90e0ef 30%, #48cae4 55%, #00b4d8 75%, #0077b6 100%);"></div>
</div>
<div style="position: relative; flex: 1; display: flex; flex-direction: column;">
<a href="AuthLogin.dc.html" style="position: absolute; left: 20px; top: 20px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #b8b8b8; border-radius: 12px; background: #ffffff; padding: 8px 12px; font-size: 14px; font-weight: 500; color: #4a4a4a; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<div class="ob-show-md" aria-hidden="true" style="display: none; padding: 72px 24px 28px; background: linear-gradient(155deg, #00b4d8 0%, #0077b6 35%, #023e8a 65%, #1f1f1f 100%); text-align: center; font-family: 'PP Editorial Old', Georgia, serif; font-size: 32px; color: #ffffff;">OpenBinding</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 72px 24px 40px;">
<div class="ob-in" style="width: 100%; max-width: 420px; display: flex; flex-direction: column;">
<span aria-hidden="true" style="margin-bottom: 24px; width: 56px; height: 56px; border-radius: 16px; background: #fafafa; display: inline-flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{iconColor}}" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
<h1 style="margin: 0; font-family: 'PP Editorial Old', 'Times New Roman', Georgia, serif; font-weight: 400; font-size: 34px; letter-spacing: -0.5px;">{{title}}</h1>
<p style="margin: 12px 0 0; color: #6a6a6a; line-height: 1.6;">{{intro}}</p>
<span style="margin-top: 14px; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid {{token.border}}; background: {{token.bg}}; padding: 2px 10px; font-size: 12px; font-weight: 500;">Reset link · {{token.label}}</span>

<sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
<form onSubmit="{{submit}}" novalidate="{{true}}" style="margin-top: 24px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column;">
<label for="rc-pass" style="margin-bottom: 6px; font-size: 14px; font-weight: 500;">New password</label>
<input id="rc-pass" type="password" value="{{pass}}" onChange="{{typePass}}" autocomplete="new-password" placeholder="At least 10 characters" aria-invalid="{{passInvalid}}" aria-describedby="rc-strength rc-pass-err" disabled="{{busy}}" style="height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid {{passBorder}}; border-radius: 12px; font-family: inherit; font-size: 14px;">
<div id="rc-strength" style="margin-top: 8px; display: flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="display: flex; gap: 4px; flex: 1;"><span style="flex: 1; height: 4px; border-radius: 9999px; background: {{bar1}};"></span><span style="flex: 1; height: 4px; border-radius: 9999px; background: {{bar2}};"></span><span style="flex: 1; height: 4px; border-radius: 9999px; background: {{bar3}};"></span></span><span style="font-size: 12px; color: #4a4a4a; min-width: 120px;">{{strength}}</span></div>
<span id="rc-pass-err" style="margin-top: 4px; font-size: 12px; color: #b91c1c;">{{passErr}}</span>
</div>
<div style="display: flex; flex-direction: column;">
<label for="rc-conf" style="margin-bottom: 6px; font-size: 14px; font-weight: 500;">Confirm password</label>
<input id="rc-conf" type="password" value="{{conf}}" onChange="{{typeConf}}" autocomplete="new-password" placeholder="Repeat the password" aria-invalid="{{confInvalid}}" aria-describedby="rc-conf-err" disabled="{{busy}}" style="height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid {{confBorder}}; border-radius: 12px; font-family: inherit; font-size: 14px;">
<span id="rc-conf-err" style="margin-top: 4px; font-size: 12px; color: #b91c1c;">{{confErr}}</span>
</div>
<button type="submit" disabled="{{busy}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 12px; background: {{btnBg}}; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;"><sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><span class="ob-spin" aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #ffffff;"></span></sc-if>{{btnLabel}}</button>
</form>
</sc-if>
<sc-if value="{{badToken}}" hint-placeholder-val="{{false}}">
<a href="AuthResetRequest.dc.html" style="margin-top: 24px; display: inline-flex; justify-content: center; align-items: center; height: 44px; border-radius: 12px; background: #0077b6; color: #ffffff; font-weight: 500; text-decoration: none;">Request a new link</a>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="AuthLogin.dc.html" style="margin-top: 24px; display: inline-flex; justify-content: center; align-items: center; height: 44px; border-radius: 12px; background: #0077b6; color: #ffffff; font-weight: 500; text-decoration: none;">Continue to log in</a>
</sc-if>
<a href="AuthLogin.dc.html" style="margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;">Back to log in</a>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { persona: "visitor", st: "success", scenario: "valid", phase: "form", pass: "", conf: "", touched: false };
  }
  componentDidMount() { try { const k = window.localStorage.getItem("ob.persona"); if (k) this.setState({ persona: k }); } catch (e) {} }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  setPersona(k) { this.setState({ persona: k }); try { window.localStorage.setItem("ob.persona", k); } catch (e) {} }
  renderVals() {
    const s = this.state;
    const st = s.st;
    const busy = st === "loading";
    const sc = s.scenario;
    const noToken = st === "empty";
    const tokenErr = st === "error" && (sc === "spent" || sc === "expired" || sc === "invalid");
    const weakErr = st === "error" && sc === "422";
    const done = st === "success" && s.phase === "done";
    const showForm = !noToken && !tokenErr && !done;
    const len = s.pass.length;
    const variety = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter((r) => r.test(s.pass)).length;
    const level = len === 0 ? 0 : (len < 10 ? 1 : (len >= 14 && variety >= 3 ? 3 : 2));
    const labels = ["Not set", "Too short", "Good", "Strong"];
    const on = "#0077b6", off = "#ededed";
    const passBad = (s.touched && len < 10) || weakErr;
    const confBad = s.touched && s.conf !== s.pass;
    const tokens = {
      valid: { label: "valid", bg: "#f0fdf4", border: "#86efac" },
      spent: { label: "already used", bg: "#fef2f2", border: "#fca5a5" },
      expired: { label: "expired", bg: "#fef2f2", border: "#fca5a5" },
      invalid: { label: "not recognized", bg: "#fef2f2", border: "#fca5a5" },
      none: { label: "missing", bg: "#fffbeb", border: "#fcd34d" },
      used: { label: "used", bg: "#fafafa", border: "#b8b8b8" }
    };
    const token = noToken ? tokens.none : (done ? tokens.used : (tokenErr ? tokens[sc] : tokens.valid));
    let title = "Set a new password", intro = "Choose a new password for your account. The link in your email works once.";
    if (noToken) { title = "This link is incomplete"; intro = "The page needs the one-time token from your email. Open the link exactly as received, or request a new one."; }
    if (tokenErr) { title = "This reset link can't be used"; intro = sc === "spent" ? "It was already used to set a password. Each link works once." : (sc === "expired" ? "It expired. Request a new link to continue." : "It isn't a valid reset link. Request a new one."); }
    if (done) { title = "Password changed"; intro = "You can log in with your new password. Sessions that were open with the old one may have been signed out."; }
    return {
      persona: s.persona, st: st, na: ["forbidden"],
      scenarios: [{ id: "valid", label: "Valid token" }, { id: "spent", label: "Token used" }, { id: "expired", label: "Token expired" }, { id: "invalid", label: "Token invalid" }, { id: "422", label: "422 weak password" }],
      scenario: sc,
      setPersona: (k) => this.setPersona(k),
      setSt: (v) => this.setState({ st: v, phase: v === "success" ? "done" : "form", scenario: v === "error" && s.scenario === "valid" ? "expired" : s.scenario }),
      setScenario: (v) => this.setState({ scenario: v, st: v === "valid" ? "success" : "error", phase: "form" }),
      title: title, intro: intro, token: token,
      iconColor: done ? "#15803d" : (tokenErr || noToken ? "#b91c1c" : "#0077b6"),
      showForm: showForm, badToken: noToken || tokenErr, done: done,
      pass: s.pass, conf: s.conf,
      typePass: (e) => this.setState({ pass: e.target.value }),
      typeConf: (e) => this.setState({ conf: e.target.value }),
      bar1: level >= 1 ? on : off, bar2: level >= 2 ? on : off, bar3: level >= 3 ? on : off,
      strength: labels[level],
      passErr: weakErr ? "422 · This password is too weak. Use at least 10 characters." : (s.touched && len < 10 ? "Use at least 10 characters." : ""),
      passInvalid: passBad ? "true" : "false", passBorder: passBad ? "#ef4444" : "#c7c7c7",
      confErr: confBad ? "The passwords don't match." : "",
      confInvalid: confBad ? "true" : "false", confBorder: confBad ? "#ef4444" : "#c7c7c7",
      busy: busy,
      btnBg: busy ? "rgba(0,119,182,0.5)" : "#0077b6",
      btnLabel: busy ? "Saving..." : "Set new password",
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (len < 10 || s.conf !== s.pass) { this.setState({ touched: true }); return; }
        this.setState({ st: "loading", touched: false });
        this.timer = setTimeout(() => this.setState({ st: "success", phase: "done" }), 1000);
      }
    };
  }
}
</script>
</body>
</html>
