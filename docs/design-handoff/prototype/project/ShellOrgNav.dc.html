<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Organization settings navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Organization settings" style="font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #1f1f1f; display: flex; flex-direction: column; gap: 2px;">
<a href="OrgOverview.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 12px; font-size: 13px; color: #0077b6; text-decoration: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>{{orgName}}</a>
<span style="padding: 0 12px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #6a6a6a;">Settings</span>
<sc-for list="{{items}}" as="i" hint-placeholder-count="3">
<a href="{{i.href}}" aria-current="{{i.current}}" style="{{i.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg><span style="flex: 1;">{{i.label}}</span><sc-if value="{{i.locked}}" hint-placeholder-val="{{false}}"><span title="Needs ADMIN" style="font-size: 11px; color: #8a8a8a;">ADMIN</span></sc-if></a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["general","members","audit"],"default":"general"},"orgName":{"editor":null,"default":"ISA Demo Group"},"canAudit":{"editor":"boolean","default":true},"$preview":{"width":280,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "general";
    const canAudit = this.props.canAudit !== false;
    const defs = [
      ["general", "General", "OrgSettings.dc.html", "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z", false],
      ["members", "Members & invitations", "OrgMembers.dc.html", "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8", false],
      ["audit", "Audit log", "OrgAudit.dc.html", "M12 8v4l3 3M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8M3 3v5h5", !canAudit]
    ];
    const items = defs.map(([k, label, href, icon, locked]) => ({
      label: label, href: href, icon: icon, current: a === k ? "page" : "false", locked: locked,
      style: "display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; " + (a === k ? "background: rgba(0,119,182,0.1); color: #0077b6;" : "color: #6a6a6a;")
    }));
    return { items: items, orgName: this.props.orgName || "ISA Demo Group" };
  }
}
</script>
</body>
</html>
