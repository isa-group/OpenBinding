# Single entry point of the lab demo (compose.lab.json, service `web`).
#
# It is baked into the image by the `lab` stage of frontend/Dockerfile, which
# copies it over /etc/nginx/conf.d/default.conf. It is not bind-mounted: under
# the supervisor's rootless docker a bind mount could be unreadable for uid 101
# and nginx then started with no server block at all.
#
# It serves the production build of the frontend and forwards /api/ to the
# gateway with the prefix removed, and /mailpit/ (read-only) to the lab's
# Mailpit. Only this server is published, as 127.0.0.1:18100 on the host;
# everything else stays on the compose network.
#
# This nginx is the only hop in front of the gateway, so it sets
# X-Forwarded-For to the address it sees ($remote_addr) instead of appending to
# whatever the client sent: a client cannot forge its address, which the
# gateway uses for login throttling.
#
# It listens on 8080 because the container runs as the unprivileged `nginx`
# user (uid 101), which cannot bind port 80. The lab supervisor drops every
# capability of the container; compose.lab.json does not declare that.

# The sign-in callback carries an authorization code and state, and the reset page a one-time token, in their
# query: those requests are logged by path only (the combined format otherwise, without the referrer).
map $request_uri $loggable_request {
    default                                 $request;
    ~^/api/v1/auth/identity/callback        "$request_method $uri $server_protocol";
    ~^/reset-password                       "$request_method $uri $server_protocol";
}

log_format openbinding_lab '$remote_addr - $remote_user [$time_local] "$loggable_request" $status $body_bytes_sent "$http_user_agent"';

# Mailpit's live updates are a WebSocket; a plain request keeps "close".
map $http_upgrade $mailpit_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Logs go to the container's output so `compose logs web` shows them.
    access_log /dev/stdout openbinding_lab;
    error_log /dev/stderr warn;

    # .bim.zip packages travel through the API.
    client_max_body_size 512m;
    large_client_header_buffers 8 64k;
    client_header_buffer_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # The trailing slash of proxy_pass replaces the /api/ prefix.
    location ^~ /api/ {
        proxy_pass          http://gateway:8000/;
        proxy_redirect      off;
        proxy_http_version  1.1;

        # Longer than the gateway's ENGINE_SOLVE_TIMEOUT_S (1800s); see
        # nginx/production/nginx.conf for why the proxy must not give up first.
        proxy_connect_timeout 10;
        proxy_read_timeout 1860;
        proxy_send_timeout 1860;

        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
    }

    location ^~ /static/ {
        proxy_pass          http://gateway:8000;
        proxy_redirect      off;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location ^~ /avatars/ {
        proxy_pass          http://gateway:8000;
        proxy_redirect      off;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Mailpit, the lab's outbox (compose.lab.json, MP_WEBROOT=/mailpit/), read-only: only GET
    # (and HEAD) reach it, so nobody injects or deletes messages through the lab's origin;
    # marking a message read fails quietly in its interface. The address goes through a
    # variable and Docker's resolver, so nginx starts even before Mailpit does and `web`
    # depends on the gateway alone.
    location ^~ /mailpit/ {
        resolver            127.0.0.11 valid=30s ipv6=off;
        set                 $mailpit http://mailpit:8025;
        limit_except GET {
            deny all;
        }
        proxy_pass          $mailpit;
        proxy_redirect      off;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $mailpit_connection;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
    }

    # Hashed build assets can be cached for good.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page application: every other path is a client route.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
