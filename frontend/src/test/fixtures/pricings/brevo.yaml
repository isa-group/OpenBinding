# A small Pricing2Yaml document for the upstream plan the composition fixtures name: brevo/brevo, plan STARTER
# (src/test/fixtures/compositions/declared.yaml and e2e/helpers/mockCompositions.ts). The plans and prices are illustrative,
# not Brevo's. PricingCard draws it in its YAML branch; no screen holds a pricing's YAML until OpenBinding keeps copies of them.
syntaxVersion: '3.1'
saasName: Brevo
version: '2026-05'
createdAt: '2026-05-01'
currency: EUR
billing:
  monthly: 1
tags:
- Email
- Automation
features:
  transactionalEmail:
    description: Send transactional e-mails through the API or SMTP relay.
    tag: Email
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
  marketingEmail:
    description: Send marketing campaigns to contact lists.
    tag: Email
    type: DOMAIN
    valueType: BOOLEAN
    defaultValue: true
  automation:
    description: Run automated workflows triggered by contact events.
    tag: Automation
    type: AUTOMATION
    automationType: TRACKING
    valueType: BOOLEAN
    defaultValue: false
usageLimits:
  emailsPerMonth:
    description: E-mails sent per month, transactional and marketing together.
    tag: Email
    type: RENEWABLE
    period:
      value: 1
      unit: MONTH
    valueType: NUMERIC
    defaultValue: 9000
    unit: email/month
    linkedFeatures:
    - transactionalEmail
    - marketingEmail
plans:
  FREE:
    description: For trying the service.
    price: 0
    unit: user/month
    features: null
    usageLimits: null
  STARTER:
    description: For small senders.
    price: 9
    unit: user/month
    features: null
    usageLimits:
      emailsPerMonth:
        value: 20000
  BUSINESS:
    description: For teams that automate their campaigns.
    price: 18
    unit: user/month
    features:
      automation:
        value: true
    usageLimits:
      emailsPerMonth:
        value: 20000
