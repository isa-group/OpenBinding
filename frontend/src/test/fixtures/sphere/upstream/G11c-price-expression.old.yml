      adminConsole:
        value: true
      centralizedBilling:
        value: true
      companyManagedGroups:
        value: true
      unlimitedApiAccessToSecurityPlatformPartners:
        value: true
      unlimitedApiAccessToProductivityPlatformPartners:
        value: true
      apiCallsForDataTransportPartners:
        value: true
      signInAsUser:
        value: true
      auditLogsWithFileEventTracking:
        value: true
      singleSignOnSsoIntegrations:
        value: true
      inviteEnforcement:
        value: true
      liveChatSupport:
        value: true
      phoneSupportDuringBusinessHours:
        value: true
    usageLimits:
      storageLimit:
        value: 5000
