        value: true
      smartSync:
        value: true
      automaticSpaceSaving:
        value: true
      viewerHistory:
        value: true
      adminConsole:
        value: true
      multiTeamAdminLogin:
        value: true
      centralizedBilling:
        value: true
      companyManagedGroups:
        value: true
      unlimitedApiAccessToSecurityPlatformPartners:
