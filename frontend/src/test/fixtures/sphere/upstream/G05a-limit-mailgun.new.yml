    valueType: NUMERIC
    defaultValue: 2
    unit: key
    type: NON_RENEWABLE
    trackable: true
    linkedFeatures:
      - apiKeys
  emailValidationsPerMonth:
    description: Email validations included per month.
    valueType: NUMERIC
    defaultValue: 0
    unit: validation
    type: RENEWABLE
    period:
      value: 1
      unit: MONTH
    linkedFeatures:
      - emailValidations
  dedicatedIpsLimit:
    description: Dedicated IPs included.
    valueType: NUMERIC
    defaultValue: 0
