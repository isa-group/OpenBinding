usageLimits:
  emailsPerDay:
    description: Emails that can be sent per day.
    valueType: NUMERIC
    defaultValue: 100
    unit: email
    type: RENEWABLE
    period:
      value: 1
      unit: DAY
    linkedFeatures:
      - smtpRelays
      - restfulEmailApi
  emailsPerMonth:
    description: Emails included per month.
    valueType: NUMERIC
    defaultValue: .inf
    unit: email
    type: RENEWABLE
    period:
      value: 1
      unit: MONTH
    linkedFeatures:
      - smtpRelays
      - restfulEmailApi
  customSendingDomainsLimit:
    description: Maximum number of custom sending domains.
    valueType: NUMERIC
    defaultValue: 1
    unit: domain
    type: NON_RENEWABLE
    trackable: true
    linkedFeatures:
      - customSendingDomains
  logRetentionDays:
