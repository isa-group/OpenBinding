custom:
  unmodeled:
    - element: volume selector (10k, 50k, 100k, 250k, 500k, 750k, 1M, 2.5M, More)
      source_says: plan price and included volume change with the selected monthly volume; the page shows Basic 10k $15, Foundation 50k $35, Scale 100k $90 at its default position
      why: prices for the other positions are rendered by script and could not be read; only the default position is modeled
    - element: email overage by sending volume tier (help center)
      source_says: 'per 1,000: Basic 1.80 at every tier; Foundation 1.30 at 50k, 1.10 at 100k-2.5M; Scale 1.10 at 100k, 0.90 at 250k, 0.75 at 500k, 0.60 at 750k, 0.50 at 1M, 0.40 at 2.5M'
      why: depends on the tier selector whose plan prices are unknown; only the rate of each plan's modeled tier is used
    - element: dedicated IP on Foundation at 100k+
      source_says: access at 50k, one dedicated IP included at 100K+ volumes
      why: usage limits cannot depend on the tier selector
    - element: overage cannot be deactivated
      source_says: extra usage is billed automatically and cannot be turned off
      why: Pricing2Yaml models overage as optional add-ons; there is no construct for mandatory pay-per-use
    - element: Early Access to New Features
      source_says: row of the Customer Support group in the comparison table; no checkmark could be read for Free, Basic, Foundation or Scale, and the table has no Enterprise column
      why: no plan or add-on is known to include it; Pricing2Yaml does not allow features that no plan or add-on grants
    - element: Managed Support
      source_says: row of the Customer Support group in the comparison table; no checkmark could be read for Free, Basic, Foundation or Scale, and the table has no Enterprise column
      why: no plan or add-on is known to include it; Pricing2Yaml does not allow features that no plan or add-on grants
    - element: custom message retention for contract customers
      source_says: custom retention periods available for contract customers
      why: no known value; negotiated
