usageLimits:
  usersLimit:
    description: Limit for users.
    type: NON_RENEWABLE
    valueType: NUMERIC
    unit: user
    linkedFeatures:
      - users
    defaultValue: 1
  storageLimit:
    description: Limit for storage.
    type: NON_RENEWABLE
    valueType: NUMERIC
    unit: GB of storage
    linkedFeatures:
      - storage
    defaultValue: 2000
  accountRecoveryAndVersionHistoryLimit:
    description: Limit for account recovery and version history.
    type: RENEWABLE
    valueType: NUMERIC
    unit: days
    linkedFeatures:
      - accountRecoveryAndVersionHistory
    defaultValue: 30
  restoreDeletedFilesLimit:
    description: Limit for restore deleted files.
    type: RENEWABLE
    valueType: NUMERIC
    unit: days
    linkedFeatures:
      - restoreDeletedFiles
    defaultValue: 30
  screenAndVideoRecordingsWithDropboxCaptureLimit:
    description: Limit for screen and video recordings with dropbox capture.
    type: RENEWABLE
    valueType: NUMERIC
    unit: minutes
    linkedFeatures:
      - screenAndVideoRecordingsWithDropboxCapture
    defaultValue: 120
  creativeReviewAndApprovalsWithDropboxReplayLimit:
    description: Limit for creative review and approvals with dropbox replay.
    type: RENEWABLE
    valueType: NUMERIC
    unit: file uploads
    linkedFeatures:
      - creativeReviewAndApprovalsWithDropboxReplay
    defaultValue: 4
  fileAndFolderTransferLimit:
    description: Limit for file and folder transfer.
    type: RENEWABLE
    valueType: NUMERIC
    unit: GB
    linkedFeatures:
      - fileAndFolderTransfer
    defaultValue: 50
  unlimitedSignatureRequestsLimit:
    description: Limit for unlimited signature requests.
    type: RENEWABLE
    valueType: NUMERIC
    unit: per month
    linkedFeatures:
      - unlimitedSignatureRequests
    defaultValue: 3
  templatesLimit:
    description: Number of eSignature templates available.
    type: NON_RENEWABLE
    valueType: NUMERIC
    unit: templates
    linkedFeatures:
      - templates
    defaultValue: 5
  1BillionApiCallsMonthForDataTransportPartnersLimit:
    description: Limit for 1 billion api calls/month for data transport partners.
    type: RENEWABLE
    valueType: NUMERIC
    unit: API calls/month
    linkedFeatures:
      - 1BillionApiCallsMonthForDataTransportPartners
    defaultValue: 0
