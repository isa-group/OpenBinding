custom:
  unmodeled:
    - element: Prepaid email credits (pay-as-you-go)
      source_says: Packs from 5,000 to 1 million emails, never expire, usable for marketing and transactional email, available on all plans; buying them gives Starter features without the Brevo logo. Pack prices are not published in the sources read.
      why: Non-expiring credit balance has no Pricing2Yaml construct and pack prices are unknown
    - element: Prepaid SMS and WhatsApp credits
      source_says: From 100 credits; SMS on all plans, WhatsApp on Professional and Enterprise; price depends on destination country (and template type for WhatsApp).
      why: Country-dependent unit prices; no price table in the sources read
    - element: Professional plan fees (API type PRO_FEES)
      source_says: Flat fee of $109 listed in the pricing API under Starter, Standard and Professional; not explained.
      why: Meaning and applicability not stated by any source
    - element: Identity resolution on Enterprise
      source_says: Custom (add-on)
      why: Negotiated Enterprise add-on with no published price or definition
    - element: Contact limit by volume tier
      source_says: 'Starter/Standard: 500 contacts at 5k emails, 1,500 at 10k, 2,500 at 15k, 500,000 from 20k; automatic upgrade to the next tier when the contact cap is exceeded.'
      why: Usage limits cannot depend on a variable; the YAML fixes them at the default (lowest) tier
    - element: Yearly billing with monthly credit top-up
      source_says: Yearly plans are paid upfront with 10% off; credits renew monthly; yearly plans cannot be paused.
      why: Billing conditions beyond the multiplier have no construct
