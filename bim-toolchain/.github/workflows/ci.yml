# CI of javiercavlop/bim-toolchain.
#
# Every `uses:` is pinned to the full commit SHA of the release its major version pointed to on 2026-11-14 (the version is
# the trailing comment); `licenses.json` ("action_pins") records them and tools/test_workflows.py fails if a `uses:` is not
# pinned to a 40-hex commit SHA or if the record and the workflows disagree. Update a pin by hand, with both.
#
# The tests that run here leave out the tier that reads the OpenBinding corpus (`-m "not openbinding_corpus"`); the
# golden-corpus job compares with the corpus and fails without it. The five OMG XSD files are not versioned in Git
# (docs/OMG_XSD_RIGHTS.md): a step right after each checkout downloads them from the official source over https and
# verifies their SHA-256 (all five or an error); the wheels and sdists built afterwards carry them.
#
# The bim-service tests marked `runner_timing` measure CPU timing (GIL switching, throughput) and do not hold on a shared
# GitHub runner (they fail or find no contention and skip): every job here deselects them; run them on a dedicated
# machine with `python -m pytest -m runner_timing packages/bim-service/tests`.
#
# No job publishes anything or reads a secret.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Runtime and test dependencies, with the ranges of the package metadata.
  DEPS: >-
    "jsonschema>=4.21,<5" "lxml>=5.2,<7" "pyyaml>=6,<7"
    "fastapi>=0.110,<1.0" "pydantic>=2,<3" "uvicorn>=0.27,<1.0"
    "httpx>=0.27,<1.0" "pytest>=8,<9"
  SRC: packages/bim-core/src:packages/bim-service/src:packages/bim-client/src

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Git must neither list nor fail to ignore the five OMG XSDs, and the table of docs/OMG_XSD_RIGHTS.md is their inventory.
      - name: The repository does not version the OMG BPMN XSDs
        run: python3 tools/xsd_inventory.py --check
      - run: python -m pip install "ruff==0.17.5"
      # Each package carries its own [tool.ruff] table; ruff is pinned so that a new release cannot fail an unchanged tree.
      - run: ruff check packages tools

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package: [bim-core, bim-service, bim-client]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ${{ env.DEPS }}
      # The corpus of BIM packages is not in this repository: the tests that need it skip with a warning
      # (see the golden-corpus job, which fails without it). The equivalence of a directory and its ZIP is
      # exercised without the corpus by the `equivalence` job below.
      - name: Tests of ${{ matrix.package }}
        run: python -m pytest -p no:cacheprovider --rootdir=. -m "not runner_timing" packages/${{ matrix.package }}/tests -rs
        env:
          PYTHONPATH: ${{ env.SRC }}

  all-packages:
    # The release workflow runs the three suites in ONE pytest session; running them only one by one here let a
    # collision between their conftest/helper module names appear first on a tag. Same command, on every change.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ${{ env.DEPS }}
      - name: Tests of bim-core, bim-service and bim-client in one session (without the corpus tier, no test may be skipped)
        shell: bash
        run: |
          python -m pytest -p no:cacheprovider --rootdir=. -m "not openbinding_corpus and not runner_timing" -rs \
            packages/bim-core/tests packages/bim-service/tests packages/bim-client/tests | tee pytest.out
          if grep -q "SKIPPED" pytest.out; then
            echo "::error::a test was SKIPPED outside the corpus tier; it must run"
            exit 1
          fi
        env:
          PYTHONPATH: ${{ env.SRC }}

  equivalence:
    # Directory versus ZIP on synthetic packages written by the tests (no corpus, no dataset), and Limits at their
    # boundary. Nothing here may skip: a skip would be a pass that compared nothing.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ${{ env.DEPS }}
      - name: Directory/ZIP equivalence and Limits near their boundary (no test may be skipped)
        shell: bash
        run: |
          python -m pytest -p no:cacheprovider --rootdir=. -rs \
            packages/bim-core/tests/test_zip_dir_equivalence.py \
            packages/bim-core/tests/test_limits_near_boundary.py | tee pytest.out
          if grep -q "SKIPPED" pytest.out; then
            echo "::error::a test of the directory/ZIP equivalence was SKIPPED; it must run"
            exit 1
          fi
        env:
          PYTHONPATH: ${{ env.SRC }}

  golden-corpus:
    # The corpus lives in OpenBinding, not here. This job compares every package with golden/bim_baseline and
    # golden/bim_core (including the package compiled from its ZIP) and FAILS when no corpus is available: a green
    # run must mean that something was compared. BIM_CORPUS_ROOT (a repository variable pointing to a checked-out
    # directory on a self-hosted runner, for example) provides it. A repository that deliberately has none sets the
    # variable BIM_CORPUS_OPTIONAL to "true"; the job then reports in its summary that the comparison was SKIPPED.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ${{ env.DEPS }}
      - name: Compare with the baseline goldens
        env:
          PYTHONPATH: ${{ env.SRC }}
          BIM_CORPUS_ROOT: ${{ vars.BIM_CORPUS_ROOT }}
          BIM_CORPUS_OPTIONAL: ${{ vars.BIM_CORPUS_OPTIONAL }}
          # With the corpus required, a corpus test that cannot find it fails instead of skipping.
          BIM_REQUIRE_CORPUS: "1"
        run: |
          if [ -z "${BIM_CORPUS_ROOT}" ] || [ ! -d "${BIM_CORPUS_ROOT}" ]; then
            if [ "${BIM_CORPUS_OPTIONAL}" = "true" ]; then
              echo "::warning::The BIM corpus is not available (BIM_CORPUS_ROOT is unset or missing) and BIM_CORPUS_OPTIONAL=true: the golden/corpus comparison was SKIPPED."
              echo "### Golden/corpus comparison SKIPPED: no BIM corpus (BIM_CORPUS_OPTIONAL=true)" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "::error::The BIM corpus is not available (BIM_CORPUS_ROOT is unset or missing): nothing was compared. Provide it, or set the variable BIM_CORPUS_OPTIONAL to true to accept that explicitly."
            exit 1
          fi
          python tools/baseline_core.py --check
          python -m pytest -p no:cacheprovider --rootdir=. packages/bim-core/tests/test_baseline_equivalence.py -rs

  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ${{ env.DEPS }}
      - name: OpenAPI snapshot is the generated document
        run: python tools/dump_service_openapi.py --check
        env:
          PYTHONPATH: ${{ env.SRC }}
      - name: Consumer contracts replay against the service
        run: python tools/consumer_fixtures.py --check
        env:
          PYTHONPATH: ${{ env.SRC }}
      - name: Goldens are in their canonical byte form and match the protocol (no corpus needed, no skips)
        shell: bash
        run: |
          python -m pytest -p no:cacheprovider --rootdir=. -rs packages/bim-core/tests/test_baseline_equivalence.py \
            -k "canonical_byte_form or engine_contract_and_protocol_digest or carry_the_four_engines_only" | tee pytest.out
          if grep -q "SKIPPED" pytest.out; then
            echo "::error::a golden test was SKIPPED; it must run"
            exit 1
          fi
        env:
          PYTHONPATH: ${{ env.SRC }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist of each package
        run: |
          rm -rf dist
          for package in bim-core bim-service bim-client; do
            (cd "packages/${package}" && uv build --out-dir ../../dist)
          done
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # Tests that open the built archives (resources in the wheel and the sdist, metadata, digests). They build what
      # they need themselves (a missing uv is an error, not a skip) and the guard runs the rest of the suite without a corpus.
      - run: python -m pip install ${{ env.DEPS }}
      - name: Packaging tests
        run: python -m pytest -p no:cacheprovider --rootdir=. -m "not openbinding_corpus" tools -rs
        env:
          PYTHONPATH: ${{ env.SRC }}
      - name: Verify the release (two reproducible builds, clean venv, digests, contracts)
        run: python tools/verify_release.py --skip-corpus

  clean-install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the OMG BPMN XSDs and verify their SHA-256 (they are not versioned in Git)
        run: python3 tools/xsd_inventory.py --ensure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Install the wheels in a clean virtual environment
        run: |
          python -m venv .verify-venv
          .verify-venv/bin/python -m pip install dist/*.whl
          .verify-venv/bin/python -m pip list
      - name: Smoke test, isolated (no PYTHONPATH, no source tree on the path)
        run: env -i .verify-venv/bin/python -I tools/smoke_installed.py packages/bim-core/tests/fixtures/example-package
      - name: Digest of the installed wheel equals the digest of the source tree
        run: |
          installed="$(env -i .verify-venv/bin/python -I -c 'import bim_core; print(bim_core.compiler_bundle_digest())')"
          # Same interpreter (it has the dependencies), but bim_core is imported from the source tree.
          tree="$(env -i .verify-venv/bin/python -I -c 'import sys; sys.path.insert(0, "packages/bim-core/src"); import bim_core; assert "src" in bim_core.__file__; print(bim_core.compiler_bundle_digest())')"
          echo "installed ${installed}"
          echo "tree      ${tree}"
          test -n "${installed}" && test "${installed}" = "${tree}"
      - name: toolchain.json of the installed wheels is reproducible
        run: |
          env -i .verify-venv/bin/python -I tools/toolchain_json.py --output toolchain.json
          env -i .verify-venv/bin/python -I tools/toolchain_json.py --check toolchain.json

  gate:
    # The one check to require in branch protection. A job that was skipped or cancelled is not a pass: the gate
    # fails unless every job ended as `success`.
    if: ${{ always() }}
    needs: [lint, tests, all-packages, equivalence, golden-corpus, contracts, build, clean-install]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a job ended as '${result}', not 'success'"
              exit 1
            fi
          done
