# bim-client: the BIM port (typing.Protocol) with an in-process and an HTTP implementation.
#
# License: no license has been chosen for the code. The holder's decision is
# pending; see ../../NOTICE.md. The metadata therefore declares none.

[project]
name = "bim-client"
version = "0.1.0"
description = "BimPort: one interface to BIM, in process (bim-core) or over HTTP (bim-service)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bim-core>=0.1,<0.2",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "bim-service>=0.1,<0.2",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
