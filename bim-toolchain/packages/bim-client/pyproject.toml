# bim-client: the BIM port (typing.Protocol) with an in-process and an HTTP implementation.
#
# License: no license has been chosen for the code. The holder's decision is
# pending; see ../../NOTICE.md. The metadata therefore declares no `license`;
# `license-files` ships NOTICE.md (a byte copy of the root one, kept equal by a
# test because hatchling cannot read files outside the project directory).

[project]
name = "bim-client"
version = "0.1.0"
description = "BimPort: one interface to BIM, in process (bim-core) or over HTTP (bim-service)"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["NOTICE.md"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    # Keeps the distribution from being uploaded to PyPI by mistake while it is private.
    "Private :: Do Not Upload",
]
dependencies = [
    "bim-core>=0.1,<0.2",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "bim-service>=0.1,<0.2",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_client"]

# The tests are not shipped: they read fixtures that live at the root of the repository.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/NOTICE.md", "/pyproject.toml"]

# Development only (workspace at ../../pyproject.toml); not part of the built metadata.
[tool.uv.sources]
bim-core = { workspace = true }
bim-service = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
