# bim-core: the BIM v1 language implementation as a normal src-layout package.
#
# License: CC-BY-4.0 (SPDX), the license of OpenBinding; holder: javiercavlop
# (titular del repositorio OpenBinding). `license-files` ships LICENSE (the license
# text) and NOTICE.md, each a byte copy of the one at the repository root, kept
# equal by tests because hatchling cannot read files outside the project
# directory. The OMG BPMN schemas under resources/vendor are not covered; see
# ../../NOTICE.md and ../../licenses.json.

[project]
name = "bim-core"
version = "0.2.0"
description = "BIM v1 service-composition and binding language: package loader, canonical JSON, expressions and Instance compiler"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    # Keeps the distribution from being uploaded to PyPI by mistake while it is private.
    "Private :: Do Not Upload",
]
dependencies = [
    "jsonschema>=4.21,<5",
    "lxml>=5.2,<7",
    # bim_core.protocol reads the bim-engine/v1 OpenAPI contract (YAML) from its resources.
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The five OMG BPMN 2.0.2 XSDs are not versioned in Git (.gitignore); hatch_build.py,
# next to this file and outside src/bim_core, downloads them from omg.org over https and
# checks their SHA-256 before every build (all five or nothing). `artifacts` makes the
# wheel and the sdist carry them although Git ignores them.
[tool.hatch.build]
artifacts = ["src/bim_core/resources/vendor/omg/bpmn/2.0.2/*.xsd"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Everything under src/bim_core ships, including resources/ (JSON Schemas,
# the engine contract and the OMG BPMN 2.0.2 XSDs), which are read
# through importlib.resources, and py.typed.
[tool.hatch.build.targets.wheel]
packages = ["src/bim_core"]

# The sdist carries the sources, the resources, the readme, the license, the
# notice and the build hook. The tests are not shipped: they read goldens and
# fixtures that live at the root of the repository, outside this directory.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE.md", "/pyproject.toml", "/hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
