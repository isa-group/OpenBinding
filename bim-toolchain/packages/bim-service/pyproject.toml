# bim-service: stateless HTTP API (bim-service/v1) over bim-core.
#
# License: CC-BY-4.0 (SPDX), the license of OpenBinding; holder: javiercavlop
# (titular del repositorio OpenBinding). `license-files` ships NOTICE.md (a byte
# copy of the root one, kept equal by a test because hatchling cannot read files
# outside the project directory); the license text is LICENSE at the repository
# root. See ../../NOTICE.md and ../../licenses.json.

[project]
name = "bim-service"
version = "0.2.0"
description = "Stateless HTTP API over bim-core: compile, validate, evaluate, re-evaluate and analyse BIM v1 packages"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
license-files = ["NOTICE.md"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    # Keeps the distribution from being uploaded to PyPI by mistake while it is private.
    "Private :: Do Not Upload",
]
dependencies = [
    "bim-core>=0.2,<0.3",
    "fastapi>=0.110,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_service"]

# The tests are not shipped: they read fixtures that live at the root of the repository.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/NOTICE.md", "/pyproject.toml"]

# Development only (workspace at ../../pyproject.toml); not part of the built metadata.
[tool.uv.sources]
bim-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default values.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]
