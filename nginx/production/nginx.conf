log_format openbinding_json escape=json
    '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"request_id":"$request_id","user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log openbinding_json;

server {

    listen 443 ssl;
    server_name openbinding.score.us.es;
    client_max_body_size 512M;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://sso.us.es https://ssopre.us.es; connect-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:" always;

    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        include             fastcgi_params;
        proxy_pass          http://gateway:8000/;
        proxy_redirect      off;

        # Longer than the gateway's own ENGINE_SOLVE_TIMEOUT_S (1800s), because
        # whoever gives up first decides the answer. At 500 a synchronous solve
        # allowed to run for half an hour died here at eight minutes with a 504,
        # and the gateway went on holding the engine for the other twenty-two.
        # Connecting is a different matter and stays short: an engine that has
        # not accepted the connection in ten seconds is not going to.
        proxy_connect_timeout 10;
        proxy_read_timeout 1860;
        proxy_send_timeout 1860;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;

    }

    location ^~ /static/ {
        include             fastcgi_params;
        proxy_pass          http://gateway:8000;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /avatars/ {
        include             fastcgi_params;
        proxy_pass          http://gateway:8000;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location ^~ /examples/ {
        alias /opt/openbinding/examples/;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name openbinding.score.us.es;
    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name openbinding.us.es;

    location / {
        return 301 https://openbinding.score.us.es$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openbinding.us.es;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://openbinding.score.us.es$request_uri;
    }
}

server {
    listen 80;
    server_name ~^(.+)\.openbinding\.us\.es$;

    location / {
        return 301 https://$1.openbinding.score.us.es$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ~^(.+)\.openbinding\.us\.es$;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://$1.openbinding.score.us.es$request_uri;
    }
}
