log_format openbinding_json escape=json
    '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"request_id":"$request_id","user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log openbinding_json;

# [impl->req~lab-deployment-production-proxy-upstream~1]
# The gateway is reached through variables in proxy_pass so that nginx resolves
# "gateway" at request time (see the resolver in the server below) and follows
# the container when Docker restarts it with a new IP. A literal
# "proxy_pass http://gateway:8000/" resolves once at start and would keep
# answering 502 against the old address.
#
# With a variable in proxy_pass nginx no longer replaces the matched location
# prefix by the URI part of proxy_pass, so /api/ must be stripped here. This
# works on the raw, undecoded $request_uri (path and query string verbatim,
# no re-encoding of %2F and similar). The old literal form sent the decoded and
# normalised path (slashes merged, dot segments and percent escapes resolved);
# the raw form is the intended difference:
#   /api/                        -> /
#   /api/x?y=1                   -> /x?y=1
#   /api/v1/a%2Fb?x=1&y=%20      -> /v1/a%2Fb?x=1&y=%20
# ("location = /api" answers 308 first.) A request that selects the /api/
# location through normalisation only (//api/x, /%61pi/x, /a/../api/x) does not
# start with "/api/" in its raw form: the map yields "" and the location
# answers 400 instead of guessing.
map $request_uri $gateway_api_uri {
    default         "";
    ~^/api(/.*)$    $1;
}

server {

    listen 443 ssl;
    server_name openbinding.score.us.es;

    # Docker's embedded DNS. Needed because proxy_pass uses variables; valid=10s
    # caps the cache so a restarted gateway is found within seconds, ipv6=off
    # because the compose network answers A records only.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gateway_upstream http://gateway:8000;

    client_max_body_size 512M;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://sso.us.es https://ssopre.us.es; connect-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:" always;

    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        include             fastcgi_params;
        if ($gateway_api_uri = "") {
            return 400;
        }

        # No URI part: the variable carries the already stripped URI.
        proxy_pass          $gateway_upstream$gateway_api_uri;
        proxy_redirect      off;

        # Longer than the gateway's own ENGINE_SOLVE_TIMEOUT_S (1800s), because
        # whoever gives up first decides the answer. At 500 a synchronous solve
        # allowed to run for half an hour died here at eight minutes with a 504,
        # and the gateway went on holding the engine for the other twenty-two.
        # Connecting is a different matter and stays short: an engine that has
        # not accepted the connection in ten seconds is not going to.
        proxy_connect_timeout 10;
        proxy_read_timeout 1860;
        proxy_send_timeout 1860;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;

    }

    location ^~ /static/ {
        include             fastcgi_params;
        # Variable without URI: the original request URI is passed unchanged.
        proxy_pass          $gateway_upstream;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /avatars/ {
        include             fastcgi_params;
        proxy_pass          $gateway_upstream;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location ^~ /examples/ {
        alias /opt/openbinding/examples/;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name openbinding.score.us.es;
    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name openbinding.us.es;

    location / {
        return 301 https://openbinding.score.us.es$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openbinding.us.es;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://openbinding.score.us.es$request_uri;
    }
}

server {
    listen 80;
    server_name ~^(.+)\.openbinding\.us\.es$;

    location / {
        return 301 https://$1.openbinding.score.us.es$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ~^(.+)\.openbinding\.us\.es$;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://$1.openbinding.score.us.es$request_uri;
    }
}
