name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # The engines' own tests. They were never run here, which is how a MiniZinc
  # builder that could not solve a single LOOP instance, and a Java unit test
  # that had been failing for months, both went unnoticed.
  engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the shared placement core
        working-directory: engines/binding-core
        run: mvn -B test

      - name: Install the shared placement core
        working-directory: engines/binding-core
        run: mvn -B -DskipTests install

      - name: Test random-search
        working-directory: engines/random-search
        run: mvn -B test

      - name: Test many-heuristic
        working-directory: engines/many-heuristic
        run: mvn -B test

      - name: Test evolutionary-heuristics
        working-directory: engines/evolutionary-heuristics
        run: mvn -B test

      - name: Test minizinc-csp
        working-directory: engines/minizinc-csp
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start services
        run: docker compose up --build -d --wait gateway-dev

      - name: Run Tests
        run: docker compose exec -T gateway-dev test
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color gateway-dev engine-minizinc engine-random-search engine-many-heuristic engine-evolutionary-heuristics

      - name: Shutdown services
        if: always()
        run: docker compose down --volumes --remove-orphans
