name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # The engines' own tests. They were never run here, which is how a MiniZinc
  # builder that could not solve a single LOOP instance, and a Java unit test
  # that had been failing for months, both went unnoticed.
  engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test the JVM engines
        # The aggregator installs binding-core before the engines that depend
        # on it, so the order does not have to be known here.
        working-directory: engines
        run: mvn -B install

      - name: Test minizinc-csp
        working-directory: engines/minizinc-csp
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # The prod service declares GATEWAY_JWT_SECRET as ${VAR:?...}, which
          # compose treats as an error when the variable is empty as well as
          # when it is unset - and .env.example leaves it empty deliberately,
          # because a shipped default signing key is worse than a missing one.
          # `docker compose config` parses the whole file including services no
          # profile selected, so it needs a value here even though only the dev
          # profile runs. A throwaway one, generated per run.
          echo "GATEWAY_JWT_SECRET=$(openssl rand -hex 32)" >> .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start services
        run: docker compose up --build -d --wait gateway-dev

      - name: Run unit tests
        run: docker compose exec -T gateway-dev test

      - name: Run integration tests
        run: docker compose exec -T gateway-dev test tests/integration -m integration
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color gateway-dev engine-minizinc engine-random-search engine-many-heuristic engine-evolutionary-heuristics

      - name: Shutdown services
        if: always()
        run: docker compose down --volumes --remove-orphans
