name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Structural checks catch retired syntax, but only compilation proves that
  # every migrated package lowers through the installed BIM Profile and
  # Dialects into a canonical BindingProblem. Keep this job on the full
  # checkout: the gateway container intentionally mounts only examples and
  # cannot see the literature, campaign, generator, and engine-fixture corpus.
  bim-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The five OMG BPMN 2.0.2 XSDs that bim-core validates BPMN with are not versioned in Git. They are
      # downloaded from omg.org over https and each SHA-256 is verified (all five or an error) before the
      # editable install below builds bim-core, and Git must neither list nor fail to ignore them.
      - name: Download the OMG BPMN XSDs, verify them and check that Git does not version them
        run: |
          python3 bim-toolchain/tools/xsd_inventory.py --ensure
          python3 bim-toolchain/tools/xsd_inventory.py --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
          enable-cache: true
          cache-dependency-glob: openbinding-gateway/uv.lock

      - name: Restore the locked gateway environment
        run: uv sync --locked --project openbinding-gateway --no-dev

      - name: Compile the complete checked-in BIM corpus
        run: openbinding-gateway/.venv/bin/python tools/check_bim_corpus.py --expected 83 --jobs 4

      - name: Check shared example authoring
        run: openbinding-gateway/.venv/bin/python tools/build_shared_examples.py --check

      - name: Check committed BIM diagrams are current
        run: tools/render_bim_diagrams.sh --check

      - name: Prove deterministic portable package builds
        run: |
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          packages=(
            examples/demo/01_simple_seq
            examples/demo/03_xor_choice
            examples/placement/01_small_placement
            examples/literature/benatallah
          )
          openbinding-gateway/.venv/bin/python tools/build_bim_packages.py --output "$first" "${packages[@]}"
          openbinding-gateway/.venv/bin/python tools/build_bim_packages.py --output "$second" "${packages[@]}"
          diff -qr "$first" "$second"

  # The bim-toolchain package tests and goldens run on every pull request, in the
  # gateway's locked environment, until the toolchain moves to its own repository.
  # These are tests, so no step is report-only.
  bim-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # bim-core validates BPMN with the five OMG BPMN 2.0.2 XSDs, which are not versioned in Git.
      - name: Download the OMG BPMN XSDs and verify them
        run: python3 bim-toolchain/tools/xsd_inventory.py --ensure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
          enable-cache: true
          cache-dependency-glob: openbinding-gateway/uv.lock

      - name: Restore the locked gateway environment with test dependencies
        run: uv sync --locked --project openbinding-gateway --extra test

      - name: Run the bim-toolchain package tests
        working-directory: bim-toolchain
        env:
          PYTHONPATH: packages/bim-core/src:packages/bim-service/src:packages/bim-client/src
        run: ../openbinding-gateway/.venv/bin/python -m pytest -p no:cacheprovider --rootdir=. -rs packages/bim-core/tests packages/bim-service/tests packages/bim-client/tests

      - name: Check the bim-toolchain goldens
        working-directory: bim-toolchain
        env:
          PYTHONPATH: packages/bim-core/src:packages/bim-service/src:packages/bim-client/src
        run: ../openbinding-gateway/.venv/bin/python tools/baseline_core.py --check

  # The lab tests live outside openbinding-gateway/tests, so no other job
  # collects them. They run on the locked gateway environment with the test extra.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
          enable-cache: true
          cache-dependency-glob: openbinding-gateway/uv.lock

      - name: Restore the locked gateway environment with test dependencies
        run: uv sync --locked --project openbinding-gateway --extra test

      - name: Run the lab tests
        run: openbinding-gateway/.venv/bin/python -m pytest lab/tests -q

      # Gate G4 runner. It exits 0 while acceptance/api holds no test.
      - name: Run the API acceptance tests
        run: openbinding-gateway/.venv/bin/python -m pytest -c acceptance/api/pytest.ini acceptance/api

      # Gate G9. Report-only: a broken contract is logged and does not fail the job.
      - name: Check import contracts (report-only)
        continue-on-error: true
        working-directory: openbinding-gateway
        run: uv run --locked --extra test --group lint lint-imports --config .importlinter

  # Gate G1 tooling. Report-only: the validate step may fail until a run into
  # develop exits 0. A broken install or version step still fails the job.
  openspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec 1.14.3
        run: npm install --global @fission-ai/openspec@1.14.3

      - name: Print the OpenSpec version
        run: openspec --version

      - name: Validate the specs and changes (report-only)
        continue-on-error: true
        run: openspec validate --strict --all

  # Gate G6 tooling. OpenFastTrace is downloaded at an exact version and
  # verified; only the trace itself is report-only.
  trace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download OpenFastTrace 4.11.0
        run: |
          mkdir -p "$RUNNER_TEMP/oft"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/oft/openfasttrace-4.11.0.jar" \
            https://github.com/itsallcode/openfasttrace/releases/download/4.11.0/openfasttrace-4.11.0.jar

      - name: Verify the OpenFastTrace checksum
        run: echo "f094cd314f0fc4236f513f66fb39260a16f72e2320beb6b4fdeb7940b9b8cf87  $RUNNER_TEMP/oft/openfasttrace-4.11.0.jar" | sha256sum -c -

      - name: Trace requirements (report-only)
        continue-on-error: true
        run: |
          paths=()
          for path in openspec/specs openbinding-gateway/src openbinding-gateway/tests engines frontend/src acceptance; do
            if [ -e "$path" ]; then paths+=("$path"); else echo "skipped (absent): $path"; fi
          done
          java -jar "$RUNNER_TEMP/oft/openfasttrace-4.11.0.jar" trace -o plain "${paths[@]}"

  # The engines' own tests. They were never run here, which is how a MiniZinc
  # builder that could not solve a single repeat workflow, and a Java unit test
  # that had been failing for months, both went unnoticed.
  engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce the BIM v1 repository cutover
        run: python3 tools/check_bim_guard.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test the JVM engines
        # The aggregator installs binding-core before the engines that depend
        # on it, so the order does not have to be known here.
        working-directory: engines
        run: mvn -B install

      - name: Test minizinc-csp
        working-directory: engines/minizinc-csp
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: dev,federated-example
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # The prod service declares GATEWAY_JWT_SECRET as ${VAR:?...}, which
          # compose treats as an error when the variable is empty as well as
          # when it is unset - and .env.example leaves it empty deliberately,
          # because a shipped default signing key is worse than a missing one.
          # `docker compose config` parses the whole file including services no
          # profile selected, so it needs a value here even though only the dev
          # profile runs. A throwaway one, generated per run.
          echo "GATEWAY_JWT_SECRET=$(openssl rand -hex 32)" >> .env
          # The administrator the integration tests sign in as. The gateway has
          # no default account, so the run creates one with a password nobody
          # knows in advance: generated here, masked in the logs, written to
          # .env for the dev service (compose passes BOOTSTRAP_ADMIN_* through)
          # and read from the container's environment by pytest.
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::${ADMIN_PASSWORD}"
          {
            echo "BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "BOOTSTRAP_ADMIN_PASSWORD=${ADMIN_PASSWORD}"
          } >> .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      # The ICSOC source dataset lives on its own branch so that development
      # branches stay small. Materialize it when the branch is published; the
      # dataset-dependent tests skip themselves otherwise.
      - name: Materialize the ICSOC source dataset
        run: |
          if git ls-remote --exit-code origin refs/heads/data/icsoc-original-dataset >/dev/null; then
            git fetch --depth=1 origin data/icsoc-original-dataset
            git archive FETCH_HEAD experimentation/icsoc/original_dataset | tar -x
          else
            echo "::warning::data/icsoc-original-dataset not found; ICSOC dataset tests will be skipped"
          fi

      - name: Build and start services
        # gateway-dev dispatches jobs through Dramatiq: POST /v1/jobs stores a
        # QUEUED row, publishes it to Redis and answers 202, and only a worker
        # moves it on. worker-dev depends on gateway-dev, not the reverse, so
        # compose does not start it unless it is named; without it every job
        # stays queued and the integration tests time out.
        run: docker compose up --build -d --wait gateway-dev worker-dev engine-multi-heuristic

      - name: Run unit tests
        # The tests that need the whole checkout read it from the read-only
        # /workspace mount; `test` is a wrapper around pytest, so the variable passes through.
        run: docker compose exec -T -e OPENBINDING_REPO_ROOT=/workspace gateway-dev test

      - name: Run ICSOC generator tests
        run: docker compose exec -T gateway-dev env PYTHONPATH=/app:/app/src pytest /app/experimentation/icsoc/generator/tests

      # The document is generated, so it is never stale - which also means a
      # contract change is invisible in review, buried in a change to a model.
      # The committed snapshot puts it in the diff.
      - name: Check the OpenAPI snapshot is current
        run: docker compose exec -T gateway-dev python tools/dump_openapi.py --check

      - name: Run integration tests
        run: docker compose exec -T gateway-dev test tests/integration -m integration
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color gateway-dev worker-dev engine-minizinc engine-random-search engine-many-heuristic engine-multi-heuristic engine-evolutionary-heuristics

      - name: Shutdown services
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (the Vitest environment) requires Node ^22.22.2 || ^24.15.0 || >=26.
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and test frontend
        working-directory: frontend
        run: |
          pnpm lint
          pnpm test

      - name: Type-check and build frontend
        working-directory: frontend
        run: pnpm build

      - name: Check generated changelog
        run: python3 tools/generate_changelog.py --check

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playground browser tests
        working-directory: frontend
        run: pnpm exec playwright test --project=mocked

      # Gate G4 runner. It exits 0 while acceptance/ui holds no spec.
      - name: Run the UI acceptance tests
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.acceptance.config.ts --pass-with-no-tests
