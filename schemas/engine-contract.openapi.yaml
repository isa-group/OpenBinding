openapi: 3.1.0
info:
  title: BIM Engine Protocol v1
  version: 1.0.0
  description: Private, source-free transport between the OpenBinding platform and BIM v1 engines.
paths:
  /internal/v1/binding-problems:
    post:
      summary: Solve a canonical BIM v1 BindingProblem IR.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindingProblemRequest'}
      responses:
        '200':
          description: Completed result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingResult'}
        '202':
          description: The engine accepted the immutable IR for asynchronous execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineJobAccepted'}
        '422':
          description: The IR or requested options are not supported by this engine mode.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413':
          description: The request body exceeds the engine transport limit.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500':
          description: The engine failed while executing an accepted request.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /internal/v1/jobs/{id}:
    get:
      summary: Read an asynchronous engine job.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Current engine job state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineJob'}
        '404':
          description: The engine job does not exist.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    Ref:
      type: object
      additionalProperties: false
      required: [resource, id]
      properties:
        resource: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
    BindingProblem:
      $ref: './bim/v1/binding-problem.schema.json'
    BindingProblemRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, protocol, problem]
      properties:
        apiVersion: {const: bim/v1}
        kind: {const: BindingProblemRequest}
        protocol: {const: bim-engine/v1}
        problem: {$ref: '#/components/schemas/BindingProblem'}
        options: {type: object}
    BindingDecision:
      type: object
      additionalProperties: false
      required: [kind, binding]
      properties:
        kind: {const: binding}
        binding: {type: object, additionalProperties: {$ref: '#/components/schemas/Ref'}}
    Violation:
      type: object
      additionalProperties: false
      required: [constraint, enforcement, penalty]
      properties:
        constraint: {$ref: '#/components/schemas/Ref'}
        enforcement: {type: string, enum: [hard, soft]}
        penalty: {type: number, minimum: 0}
        message: {type: string}
    ObjectiveComponent:
      type: object
      additionalProperties: false
      required: [metric, value, loss, weight]
      properties:
        metric: {$ref: '#/components/schemas/Ref'}
        value: {type: number}
        loss: {type: number}
        weight: {type: number, exclusiveMinimum: 0}
    ObjectiveEvaluation:
      type: object
      additionalProperties: false
      required: [mode, components, penalty, score]
      properties:
        mode: {type: string, enum: [satisfy, weighted, lexicographic, pareto]}
        components: {type: array, items: {$ref: '#/components/schemas/ObjectiveComponent'}}
        penalty: {type: number, minimum: 0}
        score:
          oneOf:
            - {type: number}
            - {type: array, items: {type: number}}
    BindingSolution:
      type: object
      additionalProperties: false
      required: [decision, metrics, objectives, penalties, violations]
      properties:
        decision: {$ref: '#/components/schemas/BindingDecision'}
        metrics: {type: object, additionalProperties: {type: number}}
        objectives: {$ref: '#/components/schemas/ObjectiveEvaluation'}
        penalties: {type: array, items: {type: number, minimum: 0}}
        violations: {type: array, items: {$ref: '#/components/schemas/Violation'}}
    BindingResult:
      type: object
      additionalProperties: false
      required: [termination, solutions]
      properties:
        termination: {type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN]}
        solutions: {type: array, items: {$ref: '#/components/schemas/BindingSolution'}}
        provenance: {type: object}
    EngineJobAccepted:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: {type: string, minLength: 1}
        status: {const: queued}
    EngineJob:
      type: object
      additionalProperties: false
      required: [id, status, created_at]
      properties:
        id: {type: string, minLength: 1}
        status: {type: string, enum: [queued, running, completed, failed]}
        created_at: {type: integer, minimum: 0}
        result: {$ref: '#/components/schemas/BindingResult'}
        error: {type: string}
      oneOf:
        - properties: {status: {enum: [queued, running]}}
          not: {anyOf: [{required: [result]}, {required: [error]}]}
        - properties: {status: {const: completed}}
          required: [result]
          not: {required: [error]}
        - properties: {status: {const: failed}}
          required: [error]
          not: {required: [result]}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
