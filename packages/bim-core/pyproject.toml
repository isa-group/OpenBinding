# Independent packaging of the pure BIM core.
#
# The sources are NOT copied or moved: the wheel is assembled from the files that
# live under openbinding-gateway/src/openbinding_gateway/v1 and under schemas/.
# Their bytes (and therefore compiler_bundle_digest(), the builtin Profile and
# Dialect versions and every IR digest) are identical to the gateway's. See
# docs/BIM_CORE.md for the boundary, the open requirements and what has not been
# verified by an actual build.
#
# Every file is listed explicitly instead of force-including the v1 directory:
# hatch applies no excludes to force-include entries, so a directory entry would
# also ship archive.py, archive_geometry.py, analysis.py and remote.py, which
# need pydantic/httpx/platform code. tests/test_bim_core_boundary.py checks that
# each listed file exists and that the lists are complete.
#
# Build wheels only (`uv build --wheel`, `python -m build --wheel`): the sources
# sit outside this directory, so an sdist would not be self-contained.

[project]
name = "bim-core"
version = "0.1.0"
description = "Pure BIM language core: package loader, canonical JSON, expressions and the Instance compiler"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD - pending owner decision (repository currently CC BY 4.0)"}
dependencies = [
    "jsonschema>=4.21,<5",
    "lxml>=5.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# There is no bim_core/ or src/bim_core/ directory next to this file, so the
# default file selection would fail; everything comes from force-include.
bypass-selection = true

# Python modules of the core, installed as the package `bim_core`. File names
# must not change: compiler_bundle_digest() hashes canonical.py, compiler.py,
# expressions.py and package.py by name.
[tool.hatch.build.targets.wheel.force-include]
"../../openbinding-gateway/src/openbinding_gateway/v1/__init__.py" = "bim_core/__init__.py"
"../../openbinding-gateway/src/openbinding_gateway/v1/canonical.py" = "bim_core/canonical.py"
"../../openbinding-gateway/src/openbinding_gateway/v1/package.py" = "bim_core/package.py"
"../../openbinding-gateway/src/openbinding_gateway/v1/expressions.py" = "bim_core/expressions.py"
"../../openbinding-gateway/src/openbinding_gateway/v1/compiler.py" = "bim_core/compiler.py"
# Vendored OMG BPMN 2.0.2 XSD bundle (compiler.py reads it next to itself).
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/BPMN20.xsd" = "bim_core/vendor/omg/bpmn/2.0.2/BPMN20.xsd"
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/BPMNDI.xsd" = "bim_core/vendor/omg/bpmn/2.0.2/BPMNDI.xsd"
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/DC.xsd" = "bim_core/vendor/omg/bpmn/2.0.2/DC.xsd"
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/DI.xsd" = "bim_core/vendor/omg/bpmn/2.0.2/DI.xsd"
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/Semantic.xsd" = "bim_core/vendor/omg/bpmn/2.0.2/Semantic.xsd"
"../../openbinding-gateway/src/openbinding_gateway/v1/vendor/omg/bpmn/2.0.2/README.md" = "bim_core/vendor/omg/bpmn/2.0.2/README.md"

# Schemas, manifests and the engine contract as data. compiler.py (unchanged)
# looks for them in $SCHEMAS_DIR/bim/v1, falling back to
# Path(__file__).parents[4]/schemas/bim/v1. For site-packages/bim_core/compiler.py
# in a POSIX virtualenv, parents[4] is the environment prefix, which is exactly
# where hatch's shared-data installs "schemas/...". That fallback is incidental
# (not true for --user, Windows or system layouts); set SCHEMAS_DIR otherwise.
[tool.hatch.build.targets.wheel.shared-data]
"../../schemas/bim/v1/application.schema.json" = "schemas/bim/v1/application.schema.json"
"../../schemas/bim/v1/binding-problem.schema.json" = "schemas/bim/v1/binding-problem.schema.json"
"../../schemas/bim/v1/candidate-catalog.schema.json" = "schemas/bim/v1/candidate-catalog.schema.json"
"../../schemas/bim/v1/constraint-set.schema.json" = "schemas/bim/v1/constraint-set.schema.json"
"../../schemas/bim/v1/dialect.schema.json" = "schemas/bim/v1/dialect.schema.json"
"../../schemas/bim/v1/engine-registration.schema.json" = "schemas/bim/v1/engine-registration.schema.json"
"../../schemas/bim/v1/engine.schema.json" = "schemas/bim/v1/engine.schema.json"
"../../schemas/bim/v1/instance.schema.json" = "schemas/bim/v1/instance.schema.json"
"../../schemas/bim/v1/optimization.schema.json" = "schemas/bim/v1/optimization.schema.json"
"../../schemas/bim/v1/placement.schema.json" = "schemas/bim/v1/placement.schema.json"
"../../schemas/bim/v1/profile.schema.json" = "schemas/bim/v1/profile.schema.json"
"../../schemas/bim/v1/routing-overlay.schema.json" = "schemas/bim/v1/routing-overlay.schema.json"
"../../schemas/bim/v1/manifests/evolutionary-heuristics.json" = "schemas/bim/v1/manifests/evolutionary-heuristics.json"
"../../schemas/bim/v1/manifests/many-heuristic.json" = "schemas/bim/v1/manifests/many-heuristic.json"
"../../schemas/bim/v1/manifests/minizinc-csp.json" = "schemas/bim/v1/manifests/minizinc-csp.json"
"../../schemas/bim/v1/manifests/random-search.json" = "schemas/bim/v1/manifests/random-search.json"
"../../schemas/engine-contract.openapi.yaml" = "schemas/engine-contract.openapi.yaml"
